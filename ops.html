<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD Operations Intelligence</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Cpath d='M8 22l5-7 4 4 7-10' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="hd-store.js"></script>
<script src="sla-engine.js"></script>
<script src="sla-history.js"></script>
<script src="sla-link.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4;--paper:#F6F8FA;--card:#FFFFFF;--ink:#111A2B;--ink2:#3E4C63;--muted:#6B7A90;--faint:#9AA7B8;--line:#E3E8EE;--line2:#D2DAE3;
  --em:#059669;--em-bg:#ECFDF5;--em-soft:#A7F3D0;--accent:#059669;
  --blue:#2563EB;--blue-bg:#EFF6FF;--amber:#C2680A;--amber-bg:#FEF6EA;--amber-soft:#F8D9A8;--rose:#E11D48;--rose-bg:#FFF1F3;--rose-soft:#FBC9D3;
  --violet:#7C3AED;--violet-bg:#F5F3FF;--hd:#0F766E;--engg:#5B57D8;--client:#D97706;
  --r:12px;--disp:'Space Grotesk',system-ui,sans-serif;--sans:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);--sh2:0 10px 30px rgba(16,24,40,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:14px}
body{background:var(--bg);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
a{color:var(--em);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.hidden{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}

.landing{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:30px;text-align:center}
.landing h1{font-family:var(--disp);font-size:26px;margin:12px 0 8px}.landing p{color:var(--ink2);line-height:1.6;margin-bottom:20px}
.landing a.lbtn{display:inline-flex;background:var(--em);color:#fff;padding:11px 22px;border-radius:10px;font-family:var(--disp);font-weight:600}

/* header + filters */
.oi-hd{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.oi-hd1{max-width:1480px;margin:0 auto;padding:12px 24px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.oi-back{font-size:12px;font-weight:600;color:var(--muted)}.oi-back:hover{color:var(--ink);text-decoration:none}
.oi-brand{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.oi-asof{margin-left:auto;font-size:12px;color:var(--muted)}
.oi-asof b{color:var(--ink2);font-weight:600}
.oi-fb{max-width:1480px;margin:0 auto;padding:10px 24px 12px;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.per{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.per button{padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.per button:hover{color:var(--ink)}.per button.on{background:var(--ink);color:#fff}
.cust{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dinput{height:30px;border:1px solid var(--line2);border-radius:8px;padding:0 8px;font:500 12px var(--sans);color:var(--ink);background:#fff}
.fgrp{display:flex;align-items:center;gap:6px}
.fgrp>label{font-size:12px;color:var(--muted)}
.oi-reset{font-size:12px;font-weight:600;color:var(--em);padding:5px 8px;border-radius:7px}.oi-reset:hover{background:var(--em-bg)}
.oi-cmp{font-size:11.5px;color:var(--muted);width:100%;margin-top:-2px}
.oi-cmp b{color:var(--ink2);font-weight:600}

.wrap{max-width:1480px;margin:0 auto;padding:18px 24px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
h2.sh{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
h2.sh span{font:400 12px var(--sans);color:var(--muted)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:13px 15px 11px;cursor:pointer;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--line2);box-shadow:0 4px 14px rgba(16,24,40,.08)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font:700 25px var(--mono);letter-spacing:-1px;margin-top:3px;line-height:1.1}
.kpi .v small{font:600 12px var(--sans);color:var(--muted);letter-spacing:0;margin-left:7px}
.kpi .d{font-size:11.5px;font-weight:600;margin-top:4px;min-height:16px}
.d.up{color:var(--rose)}.d.dn{color:var(--em)}.d.flat{color:var(--faint)}.d.gup{color:var(--em)}.d.gdn{color:var(--rose)}
.kpi svg{display:block;margin-top:6px}
.kpi .act{font-size:11.5px;font-weight:600;color:var(--em);margin-top:6px;display:inline-block}

/* briefing — the one loud element */
.brief-wrap{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:16px;margin-bottom:22px;align-items:start}
@media(max-width:1100px){.brief-wrap{grid-template-columns:1fr}}
.brief{padding:6px 0}
.bf{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:0 14px;padding:12px 18px 12px 0;border-bottom:1px solid var(--line);align-items:start}
.bf:last-child{border-bottom:none}
.bf>i{align-self:stretch;border-radius:0 4px 4px 0}
.bf.s3>i{background:var(--rose)}.bf.s2>i{background:#F59E0B}.bf.s1>i{background:#93A4B8}.bf.s0>i{background:var(--em)}
.bf h4{font-size:13.5px;font-weight:600;line-height:1.4;color:var(--ink)}
.bf p{font-size:12.5px;line-height:1.5;color:var(--ink2);margin-top:2px}
.bf p b{font-weight:600;color:var(--ink)}
.bf .go{font-size:12px;font-weight:600;color:var(--em);white-space:nowrap;padding:4px 8px;border-radius:7px;margin-top:-2px}
.bf .go:hover{background:var(--em-bg)}
.bf-more{display:block;width:100%;padding:10px;font-size:12px;font-weight:600;color:var(--em);text-align:center;border-top:1px solid var(--line)}
.brief-h{display:flex;align-items:baseline;gap:10px;padding:12px 18px 6px}
.brief-h h2{font-family:var(--disp);font-size:16px;font-weight:600}
.brief-h span{font-size:12px;color:var(--muted)}
.brief-h .cnts{margin-left:auto;display:flex;gap:10px;font-size:11.5px;color:var(--muted)}
.brief-h .cnts i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}

/* backlog side card */
.side{padding:16px 18px}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:10px 0 8px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px;cursor:pointer}.legend span:hover{color:var(--ink)}
.legend i{width:9px;height:9px;border-radius:3px}
.legend b{font:600 12px var(--mono)}
.agerow{display:grid;grid-template-columns:82px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:11.5px;padding:3px 0;cursor:pointer}
.agerow:hover{color:var(--ink)}
.agerow .bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--paper)}
.agerow .bar i{display:block;height:100%}
.agerow b{font:600 11px var(--mono);text-align:right}
.mini-h{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 6px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 16px 12px;font:600 13.5px var(--disp);color:var(--muted);position:relative;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--em)}
.tab .n{font:600 11px var(--mono);color:var(--faint)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.pad{padding:16px 18px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:560px}
.chart text{font-family:var(--mono);font-size:10px;fill:#8A99AC}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);margin-top:8px}
.keys span{display:flex;align-items:center;gap:6px}.keys i{width:10px;height:10px;border-radius:3px}
.keys i.ln{height:3px;border-radius:2px}.keys i.dash{height:0;border-top:2px dashed var(--ink2);border-radius:0;width:14px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line2);background:var(--paper);white-space:nowrap;position:sticky;top:0;z-index:1}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--ink)}
th.num,td.num{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#FAFBFC}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
td .z{color:var(--faint)}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin:1px 3px 1px 0;white-space:nowrap}
.chip.r{background:var(--rose-bg);color:var(--rose)}.chip.a{background:var(--amber-bg);color:var(--amber)}.chip.g{background:var(--em-bg);color:var(--em)}.chip.n{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.grade{display:inline-flex;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;font:700 12px var(--disp)}
.g-A{background:var(--em-bg);color:var(--em)}.g-B{background:#EEF8F1;color:#3F8F5A}.g-C{background:var(--amber-bg);color:var(--amber)}.g-D{background:#FFEDE5;color:#C2410C}.g-E{background:var(--rose-bg);color:var(--rose)}
.spk{display:block}
.side-pill{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap}
.sp-hd{background:#E6F4F2;color:var(--hd)}.sp-engg{background:#EEEDFD;color:var(--engg)}.sp-client{background:var(--amber-bg);color:var(--amber)}.sp-closed{background:var(--em-bg);color:var(--em)}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}.pri i{width:7px;height:7px;border-radius:50%}

/* risk lists */
.risk{margin-bottom:14px}
.risk-h{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer}
.risk-h h3{font-family:var(--disp);font-size:14.5px;font-weight:600}
.risk-h .c{font:700 14px var(--mono)}
.risk-h p{font-size:12px;color:var(--muted)}
.risk-h .sp{flex:1}
.risk-h .arr{color:var(--faint);transition:transform .15s}
.risk.open .risk-h .arr{transform:rotate(180deg)}
.risk-b{display:none;border-top:1px solid var(--line)}
.risk.open .risk-b{display:block}
.risk-f{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.btn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-size:12px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--faint);color:var(--ink)}
.btn.pri2{background:var(--em);border-color:var(--em);color:#fff}

/* heatmap */
.heat{display:grid;grid-template-columns:42px repeat(24,minmax(0,1fr));gap:2px;font-size:10px;color:var(--faint)}
.heat div{height:18px;border-radius:3px}
.heat .hl{display:flex;align-items:center;font-family:var(--sans);font-size:11px;color:var(--muted);height:18px}
.heat .hh{text-align:center;font-family:var(--mono);height:14px}

/* SLA note */
.sla-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:16px;background:var(--amber-bg);border:1px solid var(--amber-soft);border-radius:10px;font-size:12.5px;color:var(--ink2)}
.sla-bar.ok{background:var(--em-bg);border-color:var(--em-soft)}
.sla-bar .sp{flex:1}
.prog{width:140px;height:5px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden}.prog i{display:block;height:100%;background:var(--em)}

/* drill modal */
.ov{position:fixed;inset:0;background:rgba(17,26,43,.45);backdrop-filter:blur(2px);z-index:400;display:flex;align-items:center;justify-content:center;padding:22px}
.ovb{background:#fff;border-radius:16px;box-shadow:var(--sh2);width:100%;max-width:1200px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.ovh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ovh h3{font-family:var(--disp);font-size:16px;font-weight:600}
.ovh span{font-size:12px;color:var(--muted)}
.ovh .sp{flex:1}
.ovx{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);font-size:14px}
.ovc{overflow:auto}
.jk{font:600 11.5px var(--mono);color:var(--em);white-space:nowrap}
.trunc{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
.msel{position:relative;display:inline-block}
.msel-btn{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .15s;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;font-family:inherit}
.msel-btn:hover{border-color:var(--line2)}
.msel-btn.open{border-color:var(--accent,var(--hd,#0F766E));box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.msel-btn .msel-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel-btn .msel-cnt{background:var(--accent,var(--hd,#0F766E));color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;flex-shrink:0}
.msel-btn .msel-arrow{color:var(--faint,#9AA7B8);font-size:10px;flex-shrink:0;transition:transform .15s}
.msel-btn.open .msel-arrow{transform:rotate(180deg)}
.msel-dd{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:340px;max-height:360px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:200;display:none;flex-direction:column;overflow:hidden}
.msel-dd.open{display:flex}
.msel-dd .msel-search{border:none;border-bottom:1px solid var(--line);padding:9px 12px;font-size:12px;color:var(--ink);font-family:inherit;outline:none;width:100%;background:var(--paper,#F6F8FA);box-sizing:border-box}
.msel-dd .msel-actions{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--paper,#F6F8FA)}
.msel-dd .msel-actions button{background:none;border:1px solid var(--line);color:var(--muted,#6B7A90);padding:3px 10px;border-radius:6px;font-size:10px;font-weight:600;font-family:inherit;cursor:pointer}
.msel-dd .msel-actions button:hover{color:var(--ink);border-color:var(--line2)}
.msel-dd .msel-list{overflow-y:auto;flex:1;padding:4px 0}
.msel-dd .msel-opt{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--ink);transition:background .1s}
.msel-dd .msel-opt:hover{background:var(--paper,#F6F8FA)}
.msel-dd .msel-opt .msel-chk{width:15px;height:15px;border:1.5px solid var(--line2,#D2DAE3);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;background:#fff;transition:all .12s}
.msel-dd .msel-opt.on .msel-chk{background:var(--accent,var(--hd,#0F766E));border-color:var(--accent,var(--hd,#0F766E))}
.msel-dd .msel-opt .msel-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel-empty{padding:16px;text-align:center;color:var(--faint,#9AA7B8);font-size:11px}
@media print{.msel-dd{display:none!important}}.shgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:6px}
.shcard{border:1px solid var(--line,#E2E8F0);border-left:5px solid var(--sc);border-radius:12px;padding:12px 14px;background:#fff}
.shc-h{display:flex;justify-content:space-between;gap:6px;font-size:13px}.shc-h span{color:#64748B;font-size:11.5px}
.shc-n{font-size:30px;font-weight:800;color:var(--sc);cursor:pointer;line-height:1.15;margin:4px 0 2px;filter:brightness(.85)}
.shc-s,.shc-r{font-size:12px;color:#475569}.shc-r{margin-top:6px;padding-top:6px;border-top:1px dashed #E2E8F0}
.dl{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}.dl:hover{color:#2563EB}
.shbars{display:flex;align-items:stretch;gap:3px;height:170px;margin-top:6px}
.shcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;cursor:pointer;min-width:0}
.shcol:hover .shst{filter:brightness(1.1)}.shst{width:min(46px,85%);display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;min-height:2px}.shst i{display:block;width:100%}
.shv{font-size:10.5px;font-weight:700;color:#334155}.shl{font-size:10px;color:#64748B;white-space:nowrap}
.shdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.shpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}.shpick input{border:1px solid #CBD5E1;border-radius:8px;padding:5px 8px;font:inherit}
.shday{border:1px solid #E2E8F0;border-left:5px solid var(--sc);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.shday-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}.shday-n{margin-left:auto;font-size:12px;color:#475569}

/* ── cover page ── */
.ss-cover{position:relative;aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;font-family:Calibri,"Segoe UI",Arial,sans-serif;container-type:inline-size;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv-band{position:absolute;left:36%;right:0;top:31%;height:35%;background:#1BA9E1}
.cv-title{position:absolute;left:37%;width:61%;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;text-align:center;color:#fff;font-weight:700;font-size:3.4cqw;line-height:1.3}
.cv-title span{font-size:2.55cqw;white-space:nowrap}
.cv-art{position:absolute;left:-5%;top:-9%;width:52%;aspect-ratio:1}.cv-art svg{width:100%;height:100%;display:block}
.cv-logo{position:absolute;right:3.5%;top:7%;width:22%}
.cv-prep{position:absolute;left:58%;width:26%;top:74.5%;text-align:center}.cv-prep b{display:block;color:#1B9AD6;font-size:1.85cqw;margin-bottom:.9cqw}.cv-prep img{width:78%}

</div></div>

<div id="app" class="hidden">
  <header class="oi-hd">

<script>
(function () {
"use strict";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m];});}
/* ═══ MULTI-SELECT DROPDOWN — stays open during selection, renders on close ═══ */
var _mselInstances={},_mselIdSeq=0;

function mselCreate(cid, allLabel, options, selected, onChange, onClose){
  var id='msel-'+(++_mselIdSeq);
  _mselInstances[id]={sel:selected.slice(),opts:options,onChange:onChange,onClose:onClose||null,search:'',allLabel:allLabel};
  return id;
}

function mselHTML(id){
  var inst=_mselInstances[id]; if(!inst) return '';
  var sel=inst.sel, allLabel=inst.allLabel;
  var text=sel.length===0?allLabel:sel.length<=2?sel.join(', '):sel.length+' selected';
  return '<div class="msel" id="'+id+'">' +
    '<button type="button" class="msel-btn" data-msel="'+id+'">' +
      '<span class="msel-text">'+esc(text)+'</span>' +
      (sel.length>0?'<span class="msel-cnt">'+sel.length+'</span>':'') +
      '<span class="msel-arrow">▾</span>' +
    '</button>' +
    '<div class="msel-dd" id="'+id+'-dd">' +
      '<input class="msel-search" placeholder="Search…" data-msel-search="'+id+'" autocomplete="off"/>' +
      '<div class="msel-actions">' +
        '<button data-msel-all="'+id+'">Select all</button>' +
        '<button data-msel-none="'+id+'">Clear</button>' +
      '</div>' +
      '<div class="msel-list" id="'+id+'-list"></div>' +
    '</div></div>';
}

function mselRenderList(id){
  var inst=_mselInstances[id]; if(!inst) return;
  var listEl=document.getElementById(id+'-list'); if(!listEl) return;
  var q=inst.search.toLowerCase();
  var filtered=inst.opts.filter(function(o){return !q||o.toLowerCase().indexOf(q)>-1;});
  if(!filtered.length){listEl.innerHTML='<div class="msel-empty">No matches</div>';return;}
  listEl.innerHTML=filtered.map(function(o){
    var on=inst.sel.indexOf(o)>-1;
    return '<div class="msel-opt'+(on?' on':'')+'" data-msel-val="'+esc(o)+'" data-msel-id="'+id+'">' +
      '<span class="msel-chk">'+(on?'✓':'')+'</span>' +
      '<span class="msel-lbl">'+esc(o)+'</span></div>';
  }).join('');
}

/* Update the button text + badge without re-rendering the whole page */
function mselUpdateBtn(id){
  var inst=_mselInstances[id]; if(!inst) return;
  var btn=document.querySelector('.msel-btn[data-msel="'+id+'"]'); if(!btn) return;
  var sel=inst.sel, allLabel=inst.allLabel;
  var text=sel.length===0?allLabel:sel.length<=2?sel.join(', '):sel.length+' selected';
  btn.querySelector('.msel-text').textContent=text;
  var cnt=btn.querySelector('.msel-cnt');
  if(sel.length>0){
    if(!cnt){cnt=document.createElement('span');cnt.className='msel-cnt';btn.insertBefore(cnt,btn.querySelector('.msel-arrow'));}
    cnt.textContent=sel.length;
  } else { if(cnt) cnt.remove(); }
}

/* Close all open dropdowns and fire their onClose callbacks */
function mselCloseAll(){
  document.querySelectorAll('.msel-dd.open').forEach(function(dd){
    dd.classList.remove('open');
    var id=dd.id.replace('-dd','');
    var inst=_mselInstances[id];
    if(inst&&inst.onClose) inst.onClose();
  });
  document.querySelectorAll('.msel-btn.open').forEach(function(b){b.classList.remove('open');});
}

function mselBind(){
  /* Toggle open/close */
  document.querySelectorAll('.msel-btn[data-msel]').forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var id=btn.dataset.msel;
      var dd=document.getElementById(id+'-dd');
      var wasOpen=dd.classList.contains('open');
      mselCloseAll();
      if(!wasOpen){
        dd.classList.add('open'); btn.classList.add('open');
        mselRenderList(id);
        var si=dd.querySelector('.msel-search');
        if(si){si.value='';_mselInstances[id].search='';setTimeout(function(){si.focus({preventScroll:true});},30);}
      }
    };
  });
  /* Search */
  document.querySelectorAll('.msel-search[data-msel-search]').forEach(function(inp){
    inp.onclick=function(e){e.stopPropagation();};
    inp.oninput=function(){_mselInstances[inp.dataset.mselSearch].search=inp.value;mselRenderList(inp.dataset.mselSearch);};
  });
  /* Select all */
  document.querySelectorAll('[data-msel-all]').forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var id=btn.dataset.mselAll, inst=_mselInstances[id];
      inst.sel=inst.opts.slice();
      mselRenderList(id); mselUpdateBtn(id);
      inst.onChange(inst.sel.slice());
    };
  });
  /* Clear */
  document.querySelectorAll('[data-msel-none]').forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var id=btn.dataset.mselNone, inst=_mselInstances[id];
      inst.sel=[];
      mselRenderList(id); mselUpdateBtn(id);
      inst.onChange([]);
    };
  });
  /* Option toggle */
  document.querySelectorAll('.msel-list').forEach(function(list){
    list.onclick=function(e){
      e.stopPropagation();
      var opt=e.target.closest('.msel-opt'); if(!opt) return;
      var id=opt.dataset.mselId, val=opt.dataset.mselVal;
      var inst=_mselInstances[id]; if(!inst) return;
      var idx=inst.sel.indexOf(val);
      if(idx>-1) inst.sel.splice(idx,1); else inst.sel.push(val);
      mselRenderList(id); mselUpdateBtn(id);
      inst.onChange(inst.sel.slice());
    };
  });
}
/* Close on outside click */
document.addEventListener('click', function(){ mselCloseAll(); });
/* ══════════════════════════════════════════════════════════════════════════════
   OPERATIONS INTELLIGENCE
   Reads the shared Jira export plus what the other dashboards already know:
     • Master Data (HDClass) — who holds each status: Help Desk, Engineering or the client
     • SLA Tracker (HDSlaLink) — breached / at-risk / met, with the same rules and calendars
     • the shared status history — tickets that came back after being handed to the client
   Every number is for the chosen period and filters, compared with the period just before it.
   The briefing turns those comparisons into plain findings, ranked by how urgently they need action.
   ══════════════════════════════════════════════════════════════════════════════ */
var HS = window.HDStore, DAY = 86400000, IST = 330 * 60000, JIRA = "https://svmhelpdesk.atlassian.net/browse/";
var ALL = [], S = [], NOW = Date.now(), HIST = {}, HIST_OK = false;
var F = { per: "30d", from: "", to: "", clients: [], svms: [], types: [], pris: [], tab: "flow", sort: {}, briefAll: false };
var PRI = ["Critical", "High", "Medium", "Low"], PRI_C = { c: "#7C3AED", h: "#E11D48", m: "#D97706", l: "#64748B", "": "#C3CCD8" };
var SIDE_C = { hd: "var(--hd)", engg: "var(--engg)", client: "var(--client)" }, SIDE_L = { hd: "Help Desk", engg: "Engineering", client: "With client", closed: "Closed" };

/* ── helpers ── */
function el(id) { return document.getElementById(id); }
function num(n) { return n == null || isNaN(n) ? "—" : Math.round(n).toLocaleString(); }
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function plural(n, w, ws) { return num(n) + " " + (n === 1 ? w : (ws || w + "s")); }
function toMs(v) { if (!v) return null; if (v instanceof Date) return isNaN(v) ? null : v.getTime(); if (typeof v === "number") return Math.round((v - 25569) * DAY); var s = String(v).trim().replace(/([+-]\d{2})(\d{2})$/, "$1:$2"), t = new Date(s).getTime(); return isNaN(t) ? null : t; }
function fd(ms, y) { return ms == null ? "—" : new Date(ms).toLocaleDateString("en-GB", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: y === false ? undefined : "2-digit" }); }
function day0(ms) { return Math.floor((ms + IST) / DAY) * DAY - IST; }
function median(a) { if (!a.length) return null; a = a.slice().sort(function (x, y) { return x - y; }); var m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }
function quant(a, q) { if (!a.length) return null; a = a.slice().sort(function (x, y) { return x - y; }); return a[Math.min(a.length - 1, Math.floor(q * a.length))]; }
function dur(d) { return d == null ? "—" : d < 1 ? Math.round(d * 24) + "h" : d < 10 ? d.toFixed(1) + "d" : Math.round(d) + "d"; }
function priKey(p) { p = (p || "").toLowerCase(); if (!p) return ""; if (p.indexOf("critical") > -1 || p.indexOf("show") > -1 || p === "highest") return "c"; if (p.indexOf("high") > -1 || p.indexOf("urgent") > -1) return "h"; if (p.indexOf("medium") > -1 || p === "normal") return "m"; return "l"; }
var PK_L = { c: "Critical", h: "High", m: "Medium", l: "Low", "": "" };
function sideOf(status) { var C = window.HDClass; if (!C) return "hd"; if (C.isTerminal(status)) return "closed"; var k = C.classify3(status); return k === "client" ? "client" : k === "engg" ? "engg" : "hd"; }
function delta(cur, prev, goodWhenUp) {
  if (prev == null) return '<div class="d flat">&nbsp;</div>';
  var d = cur - prev; if (!d) return '<div class="d flat">same as before</div>';
  var p = prev ? Math.round(Math.abs(d) / prev * 100) : null, up = d > 0;
  var cls = goodWhenUp == null ? (up ? "up" : "dn") : (up === goodWhenUp ? "gup" : "gdn");
  return '<div class="d ' + cls + '">' + (up ? "▲ " : "▼ ") + num(Math.abs(d)) + (p != null && p < 1000 ? " (" + p + "%)" : "") + ' vs before</div>';
}

/* ── tickets ── */
function pick(row, km, names) { for (var i = 0; i < names.length; i++) { var k = km[names[i]]; if (k !== undefined && row[k] !== "" && row[k] != null) return row[k]; } return ""; }
function parse(rows) {
  var km = {}; if (rows[0]) Object.keys(rows[0]).forEach(function (k) { km[k.trim().toLowerCase()] = k; });
  var g = function (r, n) { return String(pick(r, km, [n]) || "").trim(); };
  return rows.map(function (r) {
    var status = g(r, "status"), created = toMs(pick(r, km, ["created"])), resolved = toMs(pick(r, km, ["resolved"])), updated = toMs(pick(r, km, ["updated"]));
    var isRes = !!(resolved || /closed|resolved|completed|delivered|cancel/i.test(status));
    var it = g(r, "issue type");
    var t = { key: g(r, "key"), summary: g(r, "summary"), status: status, priority: g(r, "priority"), pk: priKey(g(r, "priority")), project: g(r, "project") || "(no client)",
      type: it, svm: g(r, "svm in charge"), worker: g(r, "current worker"), screen: g(r, "screen name") || g(r, "menu head"), rootCause: g(r, "root cause"), fix: g(r, "type of fix"),
      hasSol: !!(g(r, "solution summary") || g(r, "analysis")), comments: parseInt(g(r, "comment count"), 10) || 0, linked: !!g(r, "linked issues"),
      created: created, resolved: resolved, updated: updated, isRes: isRes, _raw: r };
    t.doneAt = isRes ? (resolved || updated || created) : null;
    t.resDays = isRes && created && t.doneAt ? Math.max(0, (t.doneAt - created) / DAY) : null;
    return t;
  }).filter(function (t) { return t.key && t.created; });
}
function refreshSides() { ALL.forEach(function (t) { t.side = t.isRes ? "closed" : sideOf(t.status); t.ours = t.side === "hd" || t.side === "engg"; }); }

/* ── period ── */
var PERIODS = [["7d", "Last 7 days"], ["30d", "Last 30 days"], ["tm", "This month"], ["lm", "Last month"], ["90d", "Last 90 days"], ["ty", "This year"], ["all", "All time"], ["custom", "Custom"]];
function range() {
  var d0 = day0(NOW), end = d0 + DAY, x = new Date(NOW + IST), y = x.getUTCFullYear(), mo = x.getUTCMonth(), a, b = end;
  switch (F.per) {
    case "7d": a = end - 7 * DAY; break;
    case "30d": a = end - 30 * DAY; break;
    case "90d": a = end - 90 * DAY; break;
    case "tm": a = Date.UTC(y, mo, 1) - IST; break;
    case "lm": a = Date.UTC(y, mo - 1, 1) - IST; b = Date.UTC(y, mo, 1) - IST; break;
    case "ty": a = Date.UTC(y, 0, 1) - IST; break;
    case "custom":
      a = F.from ? Date.UTC(+F.from.slice(0, 4), +F.from.slice(5, 7) - 1, +F.from.slice(8, 10)) - IST : end - 30 * DAY;
      b = F.to ? Date.UTC(+F.to.slice(0, 4), +F.to.slice(5, 7) - 1, +F.to.slice(8, 10)) - IST + DAY : end;
      if (b <= a) b = a + DAY; break;
    default: a = ALL.reduce(function (m, t) { return Math.min(m, t.created); }, end); return { a: a, b: end, all: true };
  }
  return { a: a, b: b, pa: a - (b - a), pb: a };
}
function inR(ms, a, b) { return ms != null && ms >= a && ms < b; }
function rangeTxt(a, b) { return fd(a) + " – " + fd(Math.min(b - DAY, NOW)); }

/* ── scope: every filter except the period ── */
function scope() {

<!-- ── Dropdown fit ──
     Keeps every filter dropdown fully on screen: a dropdown that would run past the right edge of the window
     (e.g. the last filter in a row) opens leftwards instead, so the page no longer shifts sideways; one that
     would run past the bottom gets a shorter list. Works for every dropdown style used in the dashboards. -->
<script>
(function(){
  var SEL=".msel-dd.open, .msel-r-dd, details.mvms[open] > .mvms-dd";
  function fit(dd){
    if(!dd||!dd.getBoundingClientRect) return;
    dd.style.left=""; dd.style.right=""; dd.style.maxHeight="";
    var vw=document.documentElement.clientWidth, vh=window.innerHeight, r=dd.getBoundingClientRect();
    if(!r.width) return;

      if(r.left<8) dd.style.right=(r.left-8)+"px"; }
    var room=vh-r.top-10, css=parseFloat(getComputedStyle(dd).maxHeight)||r.height;

  }

})();
