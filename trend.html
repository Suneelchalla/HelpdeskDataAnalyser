      '<span class="flabel">Rows</span><select class="fsel" id="cpRow">'+CROW_FIELDS.map(function(f){return '<option value="'+esc(f)+'" '+(S.cpRow===f?"selected":"")+'>'+esc(f)+'</option>';}).join("")+'</select>'+
      '<span class="flabel">Columns</span><select class="fsel" id="cpCol">'+CCOL_FIELDS.map(function(f){return '<option value="'+esc(f)+'" '+(S.cpCol===f?"selected":"")+'>'+esc(f)+'</option>';}).join("")+'</select>'+
    '</div>';
    out+=pivot2D("custom","Custom Pivot","#2563EB",ppool,cpRowFn,S.cpRow,cpCols,cpColFn);
  }
  out+='</div>';
  return out;
}

/* ═══════════════════════════════ VIEW: WEEK ON WEEK ═══════════════════════════════ */
/* badge (optional): a small chip shown under the delta, e.g. a partial-week note. */
function wowCard(label,a,b,isPct,color,metric,badge){
  var d=b-a, arrow=d>0?"▲":(d<0?"▼":"→"), cls=d>0?"up":(d<0?"down":"flat");
  return '<div class="card kpi clk" data-wcard="'+metric+'" style="text-align:center;padding:16px 14px">'+
    '<div class="kl">'+label+'</div>'+
    '<div class="kv" style="color:'+color+';font-size:25px;margin-top:8px">'+b+(isPct?"%":"")+'</div>'+
    '<div style="margin-top:9px"><span class="dchip '+cls+'">'+arrow+' '+Math.abs(d)+(isPct?" pts":"")+'</span> <span class="sub">vs '+a+(isPct?"%":"")+'</span></div>'+
    (badge?'<div style="margin-top:6px"><span class="dchip flat" style="background:#FEF3E2;color:#B45309;border-color:#F5D9A8">'+badge+'</span></div>':'')+
  '</div>';
}
function deltaCell(d,isPct,neg){
  if(d===null||d===undefined) return '<span class="sub">—</span>';
  var good=neg?-d:d, cls=good>0?"up":(good<0?"down":"flat"), sym=d>0?"▲":(d<0?"▼":"→");
  return '<span class="dchip '+cls+'">'+sym+' '+Math.abs(d)+(isPct?" pts":"")+'</span>';
}
function viewWoW(){
  window.__piv={};
  if(!DATA_RES_MAX) computeResolvedSpan();   // ensure data-currency span is ready for partial-week checks
  var pool=weekPool();
  var scopeNote=(S.svm.length||S.cw.length||S.rc.length||S.issue.length||S.proj.length)?" (filters applied)":"";
  var out='<div class="up" style="margin-bottom:9px"><div class="eyebrow">Week on Week</div>'+
    '<h1 style="font-size:16px;font-weight:700;letter-spacing:-.3px;margin-top:2px">Week-on-week resolution</h1>'+
    '<div class="sub" style="margin-top:3px">ISO week numbers built from each ticket\'s <b>Resolved date</b>. Pick two weeks below — that window drives every chart, table and pivot on this tab'+esc(scopeNote)+'.</div></div>';
  if(!pool.length){ return out+'<div class="card pad"><div class="empty">No resolved tickets in scope. Week-on-week uses the Resolved date — try clearing filters or the date range.</div></div>'; }

  function fk(d){ var iw=isoWeek(d); return iw.year+"-W"+String(iw.week).padStart(2,"0"); }
  var wk={};
  pool.forEach(function(t){ var key=fk(t.resolved);
    if(!wk[key]) wk[key]={key:key,year:isoWeek(t.resolved).year,week:isoWeek(t.resolved).week,tix:[],hd:0,eg:0};
    wk[key].tix.push(t); if(t.isHD)wk[key].hd++; else wk[key].eg++; });
  var keys=Object.keys(wk).sort();
  window.__wk=wk;
  if(!S.weekB||!wk[S.weekB]) S.weekB=keys[keys.length-1];
  if(!S.weekA||!wk[S.weekA]) S.weekA=keys.length>1?keys[keys.length-2]:keys[keys.length-1];

  // the two selectors define an inclusive window
  var lo=S.weekA<=S.weekB?S.weekA:S.weekB, hi=S.weekA<=S.weekB?S.weekB:S.weekA;
  var vis=keys.filter(function(k){ return k>=lo && k<=hi; });
  var poolR=pool.filter(function(t){ var k=fk(t.resolved); return k>=lo && k<=hi; });
  var allSelected=(vis.length===keys.length);

  function m(k){ var w=wk[k]; return {t:w.tix.length,hd:w.hd,eg:w.eg,hp:pct(w.hd,w.tix.length)}; }
  var A=m(S.weekA), B=m(S.weekB);

  /* ── PARTIAL-WEEK & RUN-RATE (fixes the "apples-to-apples" problem) ──
     A week whose 7 calendar days aren't all inside the export's resolved-date
     span (typically the newest week, when the export is taken mid-week) will
     naturally show fewer resolved tickets — so a raw "W35 vs W34" delta over-
     states any drop. We compute each compared week's day-coverage and, when a
     week is partial, expose a fair per-day run-rate and a full-week projection
     instead of relying on the raw totals alone. */
  var covA=weekCoverageDays(wk[S.weekA].year, wk[S.weekA].week);
  var covB=weekCoverageDays(wk[S.weekB].year, wk[S.weekB].week);
  var partialA=covA>0&&covA<7, partialB=covB>0&&covB<7;
  var perDayA=covA>0?A.t/covA:0, perDayB=covB>0?B.t/covB:0;
  var projB=Math.round(perDayB*7);                       // B's total at current pace over a full week
  var perDayDeltaPct=perDayA>0?Math.round((perDayB-perDayA)/perDayA*100):0;
  var bBadge=partialB?("◐ "+covB+"/7 days"):"";         // small chip on the Resolved card

  /* ── ADJACENCY CHECK ──
     The week selectors only list weeks that actually have resolved tickets in
     scope, so a week with zero resolutions (e.g. a quiet week for one worker)
     is skipped — which can make "Last 2 weeks" silently compare two NON-
     consecutive weeks. Detect the gap so we can say so plainly. */
  var gap=weeksBetweenKeys(lo,hi);                        // 1 = consecutive ISO weeks
  var nonAdjacent=(vis.length>=2 && gap>1);

  var latest=keys[keys.length-1];
  var windowTxt = vis.length===1 ? ('Showing <b>'+weekLabel(vis[0])+'</b>') : ('Showing <b>'+weekLabel(lo)+'</b>–<b>'+weekLabel(hi)+'</b> · '+vis.length+' weeks');
  out+='<div class="card up d1 pad" style="margin-bottom:9px">'+
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px">'+
      '<span class="sec-title">Compare weeks</span>'+
      '<select class="fsel" id="weekA">'+keys.map(function(k){return '<option value="'+k+'" '+(S.weekA===k?"selected":"")+'>'+weekLabel(k)+' · '+weekDates(wk[k].year,wk[k].week)+'</option>';}).join("")+'</select>'+
      '<span class="sub">→</span>'+
      '<select class="fsel" id="weekB">'+keys.map(function(k){return '<option value="'+k+'" '+(S.weekB===k?"selected":"")+'>'+weekLabel(k)+' · '+weekDates(wk[k].year,wk[k].week)+'</option>';}).join("")+'</select>'+
      '<button class="chip'+(vis.length===2&&hi===latest?' on':'')+'" data-wowset="last2">Last 2 weeks</button>'+
      '<button class="chip'+(allSelected?' on':'')+'" data-wowset="all">All weeks</button>'+
      /* loud, unmissable flags right in the control bar */
      (partialB?'<span class="dchip flat" style="background:#FEF3E2;color:#B45309;border-color:#F5D9A8">⚠ '+weekLabel(S.weekB)+' in progress · '+covB+'/7 days</span>':'')+
      (nonAdjacent?'<span class="dchip flat" style="background:#FEF3E2;color:#B45309;border-color:#F5D9A8">⚠ not consecutive · '+(gap-1)+' week'+((gap-1)!==1?'s':'')+' skipped</span>':'')+
      '<span class="click" style="margin-left:auto">'+windowTxt+' \u00b7 click a metric to open tickets</span>'+
      '<button class="ghost" id="wowExport" style="margin-left:8px;display:inline-flex;align-items:center;gap:5px">\u2B07 Export Full Data ('+poolR.length+')</button>'+
    '</div>'+
    '<div class="grid" style="grid-template-columns:repeat(4,1fr)">'+
      wowCard("Resolved",A.t,B.t,false,"var(--ink)","all",bBadge)+
      wowCard("HD resolved",A.hd,B.hd,false,"var(--hd)","hd")+
      wowCard("Engg resolved",A.eg,B.eg,false,"var(--engg)","eg")+
      wowCard("HD share",A.hp,B.hp,true,"var(--hd)","hp")+
    '</div>'+
    note([
      /* When B is partial, lead with the fair per-day/run-rate read; otherwise
         the plain raw delta is already apples-to-apples. */
      partialB
        ? '<b>'+weekLabel(S.weekB)+' is only '+covB+' of 7 days in</b> (export data runs to '+fdate(DATA_RES_MAX)+'), so its <b>'+B.t+'</b> vs '+weekLabel(S.weekA)+"'s <b>"+A.t+'</b> isn\'t like-for-like. Per day: <b>'+(Math.round(perDayB*10)/10)+'/day</b> vs <b>'+(Math.round(perDayA*10)/10)+'/day</b> ('+(perDayDeltaPct>=0?'+':'')+perDayDeltaPct+'%). At this pace '+weekLabel(S.weekB)+' projects to <b>~'+projB+'</b> for the full week.'
        : 'From <b>'+weekLabel(S.weekA)+'</b> to <b>'+weekLabel(S.weekB)+'</b>, resolved '+((B.t-A.t)>=0?'rose':'fell')+' by <b>'+Math.abs(B.t-A.t)+'</b> ('+(A.t?Math.round((B.t-A.t)/A.t*100):0)+'%).',
      partialA?'Note: <b>'+weekLabel(S.weekA)+'</b> is also partial ('+covA+'/7 days) — it sits at the edge of the data window.':null,
      nonAdjacent?'These two weeks aren\'t consecutive — <b>'+(gap-1)+'</b> week'+((gap-1)!==1?'s':'')+' with no resolved tickets in scope '+((gap-1)!==1?'were':'was')+' skipped between them.':null,
      'HD share moved <b class="'+((B.hp-A.hp)>=0?'up':'dn')+'">'+arrow(B.hp-A.hp)+' '+Math.abs(B.hp-A.hp)+' pts</b> ('+A.hp+'% → '+B.hp+'%)'+((B.t<10||A.t<10)?' — note the small ticket counts make this share sensitive to a single ticket.':'.')
    ])+
  '</div>';

  // trend bars — visible window only
  var maxT=1; vis.forEach(function(k){ maxT=Math.max(maxT,wk[k].tix.length); });
  var BAR=200;
  out+='<div class="card up d2 pad" style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px"><span class="sec-title">Resolved per week — HD vs Engg</span><span class="click">'+(allSelected?"all weeks":weekLabel(lo)+"–"+weekLabel(hi))+' · click a segment</span></div><div class="stackwrap">';
  vis.forEach(function(k){ var w=wk[k]; var tot=w.tix.length; var hpx=Math.max(Math.round(tot/maxT*BAR),10);
    out+='<div class="col"><div class="tot">'+tot+'</div><div class="stack" style="height:'+hpx+'px">'+
      (w.eg>0?'<div class="seg engg" data-wk="'+k+'" data-side="eg" style="flex:'+w.eg+' '+w.eg+' 0" title="Engg '+w.eg+'">'+(w.eg/tot*hpx>=16?'<span class="sv">'+w.eg+'</span>':'')+'</div>':'')+
      (w.hd>0?'<div class="seg hd" data-wk="'+k+'" data-side="hd" style="flex:'+w.hd+' '+w.hd+' 0" title="HD '+w.hd+'">'+(w.hd/tot*hpx>=16?'<span class="sv">'+w.hd+'</span>':'')+'</div>':'')+
    '</div><div class="wx">'+weekLabel(k)+'<br>'+weekDates(w.year,w.week)+'</div></div>';
  });
  out+='</div><div class="legend" style="margin-top:9px"><span class="li"><span class="sw" style="background:var(--hd)"></span>HD resolved</span><span class="li"><span class="sw" style="background:var(--engg)"></span>Engg resolved</span></div>'+
    (function(){ var sum=vis.reduce(function(a,k){return a+wk[k].tix.length;},0);
      var busiest=vis.reduce(function(a,b){return wk[b].tix.length>wk[a].tix.length?b:a;});
      var lat=wk[vis[vis.length-1]];
      var latCov=weekCoverageDays(lat.year,lat.week);          // partial-week marker for the newest bar
      var latPartial=latCov>0&&latCov<7;
      return note([
        'Window of <b>'+vis.length+'</b> week'+(vis.length!==1?'s':'')+' — <b>'+sum.toLocaleString()+'</b> resolved, averaging <b>'+Math.round(sum/vis.length)+'</b>/week.',
        'Busiest in window: <b>'+weekLabel(busiest)+'</b> ('+weekDates(wk[busiest].year,wk[busiest].week)+') with <b>'+wk[busiest].tix.length+'</b> resolved.',
        'Newest week <b>'+weekLabel(lat.key)+'</b>'+(latPartial?' <span class="dchip flat" style="background:#FEF3E2;color:#B45309;border-color:#F5D9A8">◐ partial '+latCov+'/7 days</span>':'')+' — HD share <b class="hd">'+pct(lat.hd,lat.tix.length)+'%</b> ('+lat.hd+' HD / '+lat.eg+' Engg)'+(latPartial?'. The shorter bar partly reflects the incomplete week, not only lower output.':'.')
      ]); })()+
  '</div>';

  // detail table with deltas — visible window
  out+='<div class="card up d3" style="overflow:hidden;margin-bottom:9px"><div class="pad" style="border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><span class="sec-title">Week detail &amp; change vs previous week</span><span class="click">click a row, or an HD / Engg cell</span></div>'+
    '<div style="overflow:auto;max-height:460px"><table class="ptable"><thead><tr><th class="rh">Week</th><th class="rh">Dates</th><th>Resolved</th><th>HD</th><th>Engg</th><th>HD %</th><th>Engg %</th><th>Δ Resolved</th><th>Δ HD %</th><th>Δ Engg %</th></tr></thead><tbody>';
  vis.forEach(function(k,i){ var w=wk[k]; var tot=w.tix.length; var hp=pct(w.hd,tot);
    var prev=i>0?wk[vis[i-1]]:null; var dTot=prev?tot-prev.tix.length:null; var dHp=prev?hp-pct(prev.hd,prev.tix.length):null;
    var covRow=weekCoverageDays(w.year,w.week); var partRow=covRow>0&&covRow<7;   // flag partial rows
    out+='<tr class="rowlink" data-wk-row="'+k+'"><td class="rl">'+weekLabel(k)+(partRow?' <span title="Partial week — only '+covRow+' of 7 days are within the data" style="color:#B45309;font-weight:700">◐</span>':'')+'</td>'+
      '<td class="rl" style="font-weight:400;color:var(--muted)">'+weekDates(w.year,w.week)+'</td>'+
      '<td class="tot val" data-wkc="'+k+'" data-side="all">'+tot+'</td>'+
      '<td class="val" data-wkc="'+k+'" data-side="hd" style="color:var(--hd);font-weight:700">'+w.hd+'</td>'+
      '<td class="val" data-wkc="'+k+'" data-side="eg" style="color:var(--engg);font-weight:700">'+w.eg+'</td>'+
      '<td class="mono">'+hp+'%</td>'+
      '<td class="mono" style="color:var(--engg)">'+(100-hp)+'%</td>'+
      '<td>'+deltaCell(dTot,false)+'</td><td>'+deltaCell(dHp,true)+'</td>'+
      '<td>'+deltaCell(dHp===null?null:-dHp,true,true)+'</td></tr>';
  });
  out+='</tbody></table></div>'+
    (function(){ if(vis.length<2) return ""; var jumps=[]; for(var i=1;i<vis.length;i++){ jumps.push({k:vis[i],d:wk[vis[i]].tix.length-wk[vis[i-1]].tix.length}); }
      var up=jumps.reduce(function(a,b){return b.d>a.d?b:a;}), dn=jumps.reduce(function(a,b){return b.d<a.d?b:a;});
      return note([
        'Biggest week-over-week rise: <b class="up">'+weekLabel(up.k)+' (+'+up.d+')</b> vs the prior week.',
        'Biggest drop: <b class="dn">'+weekLabel(dn.k)+' ('+dn.d+')</b> vs the prior week.'
      ]); })()+
  '</div>';

  // pivots — visible window
  out+='<div class="card up d4 pad" style="margin-bottom:9px">'+pivHeader("Week × Solved",[chip("Window",allSelected?"all weeks":weekLabel(lo)+"–"+weekLabel(hi))],"Resolved tickets per ISO week, split HD vs Engg.")+
    pivot2D("wkhd","Week × Solved","#0F766E",poolR,function(t){return weekKeyLabel(t.resolved);},"Week",[{key:"HD",label:"HD"},{key:"ENGG",label:"ENGG"}],function(t){return t.isHD?"HD":"ENGG";})+
    (function(){ var bh=null,bl=null; vis.forEach(function(k){ var p=pct(wk[k].hd,wk[k].tix.length); if(bh===null||p>pct(wk[bh].hd,wk[bh].tix.length))bh=k; if(bl===null||p<pct(wk[bl].hd,wk[bl].tix.length))bl=k; });
      return note([ hdSentence(poolR),
        (bh&&bl&&bh!==bl)?('Highest HD-share week: <b class="hd">'+weekLabel(bh)+' ('+pct(wk[bh].hd,wk[bh].tix.length)+'%)</b>; lowest: <b class="dn">'+weekLabel(bl)+' ('+pct(wk[bl].hd,wk[bl].tix.length)+'%)</b>.'):null ]); })()+
  '</div>';
  var gAll=cnt(poolR,function(t){return t.group;}), tgAll=topKey(gAll);
  out+='<div class="card up d4 pad">'+pivHeader("Week × Group",[chip("Window",allSelected?"all weeks":weekLabel(lo)+"–"+weekLabel(hi))],"Resolved tickets per ISO week across Group 1 / Group 2 / Others.")+
    pivot2D("wkgroup","Week × Group","#5B57D8",poolR,function(t){return weekKeyLabel(t.resolved);},"Week",GROUP_ORDER.map(function(g){return {key:g,label:g};}),function(t){return t.group;})+
    note([ 'Resolved by group — <b>Group 1</b> '+(gAll["Group 1"]||0)+' ('+pct(gAll["Group 1"]||0,poolR.length)+'%), <b>Group 2</b> '+(gAll["Group 2"]||0)+' ('+pct(gAll["Group 2"]||0,poolR.length)+'%), <b>Others</b> '+(gAll["Others"]||0)+' ('+pct(gAll["Others"]||0,poolR.length)+'%).', tgAll?('Most resolved: <b>'+esc(tgAll)+'</b>.'):null ])+
    groupLegend()+'</div>';
  return out;
}

function th(col,label){

/* ═══════════════════════════════ BIND events per tab ═══════════════════════════════ */
function bindPivotCells(){
  // generic 2-D pivot cells (used by Pivots tab and Week-on-Week pivots)
  document.querySelectorAll('.ptable td.val[data-piv]').forEach(function(td){
    if(td.classList.contains("zero")) return;
    td.onclick=function(){
      var reg=window.__piv[td.dataset.piv]; if(!reg) return;
      var r=td.dataset.r, c=td.dataset.c;
      var sub=reg.tickets.filter(function(t){ return (r==="__all__"||reg.rowKeyFn(t)===r) && (c==="__all__"||reg.colKeyFn(t)===c); });
      var title=reg.title+" — "+(r==="__all__"?"All rows":r)+(c==="__all__"?"":" · "+c);
      openModal(title,"🧮",reg.color,sub);
    };
  });
  // nested group pivot cells
  document.querySelectorAll('.ptable td.val[data-nested]').forEach(function(td){
    if(td.classList.contains("zero")) return;
    td.onclick=function(){
      var reg=window.__pivNested; if(!reg) return;
      var g=td.dataset.group, sv=td.dataset.solved, sm=td.dataset.svm, w=td.dataset.worker;
      var sub=reg.tickets.filter(function(t){
        if(g!=="__all__"&&t.group!==g) return false;
        if(sv!=="__all__"&&(t.isHD?"HD":"ENGG")!==sv) return false;
        if(sm!=="__all__"&&(t.svm||"(blank)")!==sm) return false;
        if(w!=="__all__"&&(t.currentWorker||"(blank)")!==w) return false;
        return true;
      });
      var parts=[]; if(g!=="__all__")parts.push(g); if(sv!=="__all__")parts.push(sv); if(sm!=="__all__")parts.push(sm); if(w!=="__all__")parts.push("worker "+w);
      openModal(parts.join(" · ")||"All clarification tickets","🧮","#0F766E",sub);
    };
  });
}
function bindMain(){

  document.querySelectorAll("th[data-sort]").forEach(function(h){
    h.onclick=function(){
      var c=h.dataset.sort;
      if(S.sortCol===c) S.sortDir=S.sortDir==="asc"?"desc":"asc";
      else { S.sortCol=c; S.sortDir="desc"; }

  bindPivotCells();

  if(S.tab==="daily"){
    var byDay=window.__dailyByDay||{};

        else if(kpi==="resolved") openModal("All closed tickets","✅","#5B57D8",dResolved,"resolved");
      };
    });

    document.querySelectorAll(".ddot").forEach(function(d){
      d.onclick=function(){

    /* stacked bar segment clicks */
    document.querySelectorAll("[data-dbar]").forEach(function(s){

/* ═══════════════════════════════ UPLOAD FLOW ═══════════════════════════════ */
/* ═══════════════════════════════ VIEW: EDIT DATA ═══════════════════════════════
   Spreadsheet-style editor over the raw rows: per-column filters, global search,
   click-to-sort, pagination, add/delete row. "Apply & Recalculate" writes edits
   back to the shared store and re-normalizes, so every tab (and the Follow-up
   Tracker) recomputes — without re-uploading the Excel. */
var ED_PAGE=50;
function edFmt(v){ if(v===null||v===undefined) return ""; if(v instanceof Date) return isNaN(v)?"":v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0"); return String(v); }
function edInit(){
  ED.seq=0;
  ED.work=RAW_ROWS.map(function(r){ var o={__id:ED.seq++}; for(var k in r){ if(Object.prototype.hasOwnProperty.call(r,k)) o[k]=r[k]; } return o; });
  ED._init=true;
}
function edCols(){
  var seen={}, out=[];
  ED.work.forEach(function(r){ for(var k in r){ if(k!=="__id" && Object.prototype.hasOwnProperty.call(r,k) && !seen[k]){ seen[k]=1; out.push(k); } } });
  return out;
}
function edCmp(a,b,col,dir){
  var av=a[col],bv=b[col];
  if(av instanceof Date && bv instanceof Date) return dir==="asc"?av-bv:bv-av;
  var as=edFmt(av),bs=edFmt(bv), an=parseFloat(as),bn=parseFloat(bs);
  if(!isNaN(an)&&!isNaN(bn)&&as.trim()!==""&&bs.trim()!=="") return dir==="asc"?an-bn:bn-an;
  return dir==="asc"?as.localeCompare(bs):bs.localeCompare(as);
}
function edIsBlank(v){ var s=edFmt(v).trim().toLowerCase(); return s===""||s==="nan"; }
function edView(cols){
  var l=ED.work;
  var active=Object.keys(ED.filters).filter(function(k){return ED.filters[k];});
  if(active.length) l=l.filter(function(r){ return active.every(function(k){ return edFmt(r[k]).toLowerCase().indexOf(ED.filters[k].toLowerCase())>-1; }); });
  var blanks=Object.keys(ED.blankFilters||{}).filter(function(k){return ED.blankFilters[k];});
  if(blanks.length) l=l.filter(function(r){ return blanks.every(function(k){ return edIsBlank(r[k]); }); });
  if(ED.search){ var q=ED.search.toLowerCase(); l=l.filter(function(r){ return cols.some(function(k){ return edFmt(r[k]).toLowerCase().indexOf(q)>-1; }); }); }
  if(ED.sortCol) l=l.slice().sort(function(a,b){ return edCmp(a,b,ED.sortCol,ED.sortDir); });
  return l;
}
function viewData(){
  if(!ED._init) edInit();
  var cols=edCols();
  var view=edView(cols);
  var pageCount=Math.max(1,Math.ceil(view.length/ED_PAGE));
  if(ED.page>pageCount-1) ED.page=pageCount-1; if(ED.page<0) ED.page=0;
  var pageRows=view.slice(ED.page*ED_PAGE, ED.page*ED_PAGE+ED_PAGE);
  var hasFilter=Object.keys(ED.filters).some(function(k){return ED.filters[k];})||ED.search||Object.keys(ED.blankFilters||{}).some(function(k){return ED.blankFilters[k];});

  var h='<div style="padding:16px 22px 40px">';
  // toolbar
  h+='<div class="card" style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 18px;margin-bottom:9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
       '<div style="width:42px;height:42px;border-radius:10px;background:var(--hd-bg);border:1px solid var(--hd-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">✏️</div>'+
       '<div style="min-width:0">'+
         '<div style="font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink)">Edit Data <span id="ed-dirty" style="color:var(--amber);font-size:11px;font-weight:700;margin-left:6px;'+(ED.dirty?'':'display:none')+'">● unsaved edits</span></div>'+
         '<div style="font-size:12px;color:var(--ink2);margin-top:2px">'+ED.work.length.toLocaleString()+' rows · '+cols.length+' columns · correct any field, then Recalculate. Edits are shared with the Follow-up Tracker too.</div>'+
       '</div>'+
       '<div style="flex:1"></div>'+
       '<input id="ed-search" type="text" value="'+esc(ED.search)+'" placeholder="🔍 Search all columns…" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--ink);background:var(--card);font-family:var(--sans);min-width:200px"/>'+
       '<button id="ed-add" class="ghost">＋ Row</button>'+
       '<button id="ed-revert" class="ghost">↺ Revert to upload</button>'+
       '<button id="ed-apply" style="background:'+(ED.dirty?'var(--hd)':'var(--line)')+';border:none;color:#fff;padding:9px 18px;border-radius:8px;font-size:12px;font-weight:800;cursor:'+(ED.dirty?'pointer':'default')+'">⟳ Apply &amp; Recalculate</button>'+
     '</div>';
  if(hasFilter) h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:9px 16px;background:var(--hd-bg);border-radius:8px;border:1px solid var(--hd-soft)">'+
       '<span style="color:var(--hd);font-size:12px;font-weight:600">Showing '+view.length.toLocaleString()+' of '+ED.work.length.toLocaleString()+' rows</span>'+
       '<button id="ed-clear" class="ghost" style="margin-left:auto">✕ Clear filters</button></div>';
  // table
  h+='<div class="card" style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden">';
  h+='<div style="overflow:auto;max-height:62vh"><table style="border-collapse:collapse;font-size:12px;min-width:100%">';
  var hdr='padding:8px 10px;text-align:left;font-size:10px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--line2);background:var(--paper);position:sticky;top:0;z-index:3;white-space:nowrap;cursor:pointer;user-select:none';
  h+='<thead><tr>';
  h+='<th style="'+hdr+';left:0;z-index:4;min-width:34px;text-align:center;cursor:default">#</th>';
  cols.forEach(function(c){ var ar=ED.sortCol===c?(ED.sortDir==="asc"?" ↑":" ↓"):""; h+='<th class="ed-sort" data-col="'+esc(c)+'" style="'+hdr+'" title="Click to sort">'+esc(c)+'<span style="color:var(--hd);font-size:9px">'+ar+'</span></th>'; });
  h+='</tr><tr>';
  h+='<th style="position:sticky;top:31px;left:0;z-index:4;background:var(--paper);border-bottom:1px solid var(--line)"></th>';
  cols.forEach(function(c){
    var bon=!!(ED.blankFilters&&ED.blankFilters[c]);
    h+='<th style="position:sticky;top:31px;z-index:3;background:var(--paper);border-bottom:1px solid var(--line);padding:4px 6px">'+
         '<div style="display:flex;align-items:center;gap:4px">'+
           '<input class="ed-filter" data-col="'+esc(c)+'" value="'+esc(ED.filters[c]||"")+'" placeholder="'+(bon?'blanks only':'filter\u2026')+'" '+(bon?'disabled ':'')+'style="flex:1;min-width:64px;border:1px solid var(--line2);border-radius:5px;padding:3px 6px;font-size:11px;color:var(--ink2);background:'+(bon?'var(--paper)':'var(--card)')+';font-family:var(--sans)"/>'+
           '<button class="ed-blank" data-col="'+esc(c)+'" title="'+(bon?'Showing only blank '+esc(c)+' \u2014 click to clear':'Show only rows where '+esc(c)+' is blank')+'" style="flex-shrink:0;border:1px solid '+(bon?'var(--hd)':'var(--line2)')+';background:'+(bon?'var(--hd)':'var(--card)')+';color:'+(bon?'#fff':'var(--muted)')+';border-radius:5px;padding:3px 7px;font-size:11px;font-weight:700;cursor:pointer;line-height:1.3">\u2205</button>'+
         '</div>'+
       '</th>';
  });
  h+='</tr></thead><tbody>';
  if(!pageRows.length) h+='<tr><td colspan="'+(cols.length+1)+'" style="padding:24px;text-align:center;color:var(--faint);font-size:12px">No rows match the current filters.</td></tr>';
  pageRows.forEach(function(r){
    h+='<tr style="border-bottom:1px solid var(--line)">';
    h+='<td style="position:sticky;left:0;z-index:1;background:var(--card);padding:2px 4px;text-align:center"><button class="ed-del" data-id="'+r.__id+'" title="Delete row" style="background:transparent;border:none;color:var(--faint);font-size:13px;cursor:pointer;padding:2px">🗑</button></td>';
    cols.forEach(function(c){ h+='<td style="padding:0;border-right:1px solid var(--paper)"><input class="ed-cell" data-id="'+r.__id+'" data-col="'+esc(c)+'" value="'+esc(edFmt(r[c]))+'" style="width:100%;min-width:110px;border:1px solid transparent;border-radius:6px;padding:5px 7px;font-size:12px;color:var(--ink);background:transparent;font-family:var(--sans)"/></td>'; });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  // pager
  h+='<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);background:var(--paper)">'+
       '<span style="font-size:11px;color:var(--ink2)">Rows '+(view.length?ED.page*ED_PAGE+1:0)+'–'+Math.min(ED.page*ED_PAGE+ED_PAGE,view.length)+' of '+view.length.toLocaleString()+'</span>'+
       '<div style="flex:1"></div>'+
       '<button class="ghost ed-pg" data-pg="first" '+(ED.page===0?'disabled':'')+'>« First</button>'+
       '<button class="ghost ed-pg" data-pg="prev" '+(ED.page===0?'disabled':'')+'>‹ Prev</button>'+
       '<span style="font-size:11px;color:var(--ink2);font-weight:700">Page '+(ED.page+1)+' / '+pageCount+'</span>'+
       '<button class="ghost ed-pg" data-pg="next" '+(ED.page>=pageCount-1?'disabled':'')+'>Next ›</button>'+
       '<button class="ghost ed-pg" data-pg="last" '+(ED.page>=pageCount-1?'disabled':'')+'>Last »</button>'+
     '</div>';
  h+='</div></div>';
  return h;
}
function reData(){ var m=el("main"); if(!m)return; m.innerHTML=viewData(); bindData(); }
function edRestoreFocus(){
  if(!ED._focus) return;
  var sel = ED._focus.type==="search" ? "#ed-search" : '.ed-filter[data-col="'+(window.CSS&&CSS.escape?CSS.escape(ED._focus.col):ED._focus.col)+'"]';
  var node=document.querySelector(sel);
  if(node){ node.focus(); try{ var v=node.value; node.setSelectionRange(v.length,v.length); }catch(e){} }
  ED._focus=null;
}
function bindData(){
  var main=el("main"); if(!main) return;
  // cell edits — update in place, no re-render (keeps focus/caret)
  main.querySelectorAll(".ed-cell").forEach(function(inp){
    inp.oninput=function(){
      var id=+inp.dataset.id, col=inp.dataset.col;
      for(var i=0;i<ED.work.length;i++){ if(ED.work[i].__id===id){ ED.work[i][col]=inp.value; break; } }
      if(!ED.dirty){ ED.dirty=true; var d=el("ed-dirty"); if(d) d.style.display=""; var a=el("ed-apply"); if(a){ a.style.background="var(--hd)"; a.style.cursor="pointer"; } }
    };
  });
  main.querySelectorAll(".ed-del").forEach(function(b){ b.onclick=function(){ var id=+b.dataset.id; ED.work=ED.work.filter(function(r){return r.__id!==id;}); ED.dirty=true; reData(); }; });
  main.querySelectorAll(".ed-sort").forEach(function(th){ th.onclick=function(){ var c=th.dataset.col; if(ED.sortCol===c){ ED.sortDir=ED.sortDir==="asc"?"desc":"asc"; } else { ED.sortCol=c; ED.sortDir="asc"; } reData(); }; });
  main.querySelectorAll(".ed-filter").forEach(function(inp){ inp.oninput=function(){ var c=inp.dataset.col; if(inp.value) ED.filters[c]=inp.value; else delete ED.filters[c]; ED.page=0; ED._focus={type:"filter",col:c}; reData(); edRestoreFocus(); }; });
  main.querySelectorAll(".ed-blank").forEach(function(b){ b.onclick=function(){ var c=b.dataset.col; if(!ED.blankFilters) ED.blankFilters={}; if(ED.blankFilters[c]){ delete ED.blankFilters[c]; } else { ED.blankFilters[c]=true; delete ED.filters[c]; } ED.page=0; reData(); }; });
  var s=el("ed-search"); if(s) s.oninput=function(){ ED.search=s.value; ED.page=0; ED._focus={type:"search"}; reData(); edRestoreFocus(); };
  main.querySelectorAll(".ed-pg").forEach(function(b){ b.onclick=function(){ var p=b.dataset.pg; var cols=edCols(); var pc=Math.max(1,Math.ceil(edView(cols).length/ED_PAGE)); if(p==="first")ED.page=0; else if(p==="prev")ED.page=Math.max(0,ED.page-1); else if(p==="next")ED.page=Math.min(pc-1,ED.page+1); else ED.page=pc-1; reData(); }; });
  var add=el("ed-add"); if(add) add.onclick=function(){ var cols=edCols(); var blank={__id:ED.seq++}; cols.forEach(function(c){blank[c]="";}); ED.work.unshift(blank); ED.dirty=true; ED.page=0; reData(); };
  var cl=el("ed-clear"); if(cl) cl.onclick=function(){ ED.filters={}; ED.blankFilters={}; ED.search=""; ED.page=0; reData(); };
  var rv=el("ed-revert"); if(rv) rv.onclick=function(){
    if(!BLOB) return;
    if(!confirm("Discard all in-app edits and reload the originally uploaded file?")) return;
    if(window.HDStore) HDStore.clearRows();
    readFile(BLOB).then(function(rows){ rebuildFromRows(rows); if(window.HDStore) HDStore.saveRows(rows); ED._init=false; ED.filters={}; ED.blankFilters={}; ED.search=""; ED.sortCol=null; ED.page=0; ED.dirty=false; reData(); });
  };
  var ap=el("ed-apply"); if(ap) ap.onclick=function(){
    if(!ED.dirty) return;
    var cols=edCols();
    var clean=ED.work.map(function(r){ var o={}; cols.forEach(function(c){ o[c]=r[c]; }); return o; });
    rebuildFromRows(clean);
    if(window.HDStore) HDStore.saveRows(clean);
    ED.dirty=false;
    // re-init working copy from the applied rows and refresh tab (counts recompute on visit)
    ED._init=false;
    render();
  };
}

function handleUpload(e){
  var file=e.target.files&&e.target.files[0]; if(!file) return;
  FILENAME=file.name;
  var btn=el("uploadBtn"); if(btn){ btn.textContent="Reading…"; btn.disabled=true; }
  readFile(file).then(function(rows){
    rebuildFromRows(rows);
    if(window.HDStore){ HDStore.clearRows(); HDStore.saveRows(rows); }
    ED={ work:[], filters:{}, blankFilters:{}, search:"", sortCol:null, sortDir:"asc", page:0, dirty:false, seq:0 };
    // reset view state on new upload
    S.svm=[]; S.cw=[]; S.rc=[]; S.issue=[]; S.proj=[]; S.from=""; S.to=""; S.dlabel="All time"; S._excFilter=null; S.pendAction="";
    S.tab="perf"; S.tRc="__CLAR__"; S.tStatus="Closed"; S.pivot="hdworker"; S.pIssue=""; S.pRc=""; S.pStatus=""; S._pivFor=null; S.weekA=""; S.weekB=""; S.sortCol="total"; S.sortDir="desc"; S.dType="";
    render();
    // footer
  }).catch(function(err){ alert("Could not read file: "+err.message); if(btn){btn.textContent="Upload Jira Excel";btn.disabled=false;} });
  e.target.value="";
}

function renderLanding(){
  el("app").innerHTML=''+
  '<div class="landing">'+
    '<div class="deco b1"></div><div class="deco b2"></div>'+
    '<div class="deco ring r1"></div><div class="deco ring r2"></div>'+
    '<div class="landing-card up">'+
      '<div class="brand-mark">'+
        '<span class="bar"><i style="height:16px;background:var(--hd)"></i><i style="height:32px;background:var(--hd2)"></i><i style="height:12px;background:var(--engg2)"></i><i style="height:26px;background:var(--engg)"></i></span>'+
        '<span style="font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.4px">HD Ticket Trend Tracker</span>'+
      '</div>'+
      '<p style="color:var(--ink2);font-size:13px;margin:-6px 0 22px;line-height:1.6">Upload your Jira export to see, month by month and person by person, how much the Help Desk resolved on its own versus escalating to Engineering.</p>'+
      '<div class="upload-panel">'+
        '<div class="dz" id="dz">'+
          '<div style="font-size:34px;margin-bottom:8px">📊</div>'+
          '<div style="font-family:var(--disp);font-weight:600;font-size:15px;margin-bottom:4px">Drop your Jira Excel here</div>'+
          '<div class="sub" style="margin-bottom:9px">.xlsx exported from Jira · any size · the whole file is read in your browser</div>'+
          '<button class="btn-primary" id="uploadBtn">Choose Excel file</button>'+
        '</div>'+
        '<div style="margin-top:18px;text-align:left">'+
          '<div class="eyebrow" style="margin-bottom:8px">Columns the dashboard reads</div>'+
          '<div class="hint-cols">'+
            ["Issue Type","Key","Summary","SVM In Charge","Root Cause","Status","Components","Linked Issues","Solved BY","Created","Resolved"].map(function(c){return '<span>'+c+'</span>';}).join("")+
          '</div>'+
          '<div class="sub" style="margin-top:12px;line-height:1.6"><b style="color:var(--hd)">HD</b> vs <b style="color:var(--engg)">ENGG</b> is read from <b>Solved BY</b>; a value in <b>Linked Issues</b> confirms an Engineering escalation. Next month, upload the same-format file — everything recalculates automatically.</div>'+
        '</div>'+
      '</div>'+
      '<input type="file" id="fileinput" accept=".xlsx,.xls">'+
    '</div>'+
  '</div>';
  var fi=el("fileinput");
  el("uploadBtn").onclick=function(){ fi.click(); };
  el("dz").onclick=function(){ fi.click(); };
  fi.onchange=handleUpload;
  var dz=el("dz");
  ["dragenter","dragover"].forEach(function(ev){ dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add("over");}); });
  ["dragleave","drop"].forEach(function(ev){ dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove("over");}); });
  dz.addEventListener("drop",function(e){
    var file=e.dataTransfer.files&&e.dataTransfer.files[0];
    if(file){ FILENAME=file.name; readFile(file).then(function(rows){ RAW=normalize(rows).filter(function(t){return t.key;}); computeResolvedSpan(); S.tab="perf"; render(); }).catch(function(err){alert("Could not read file: "+err.message);}); }
  });
}

/* footer appended after each render */
var _origRenderMain=renderMain;
renderMain=function(){
  _origRenderMain();
  var main=el("main"); if(!main)return;
  var fdiv=document.createElement("div"); fdiv.className="footer";
  var inScopeCount=RAW.filter(function(t){ return inRange(t) && (!S.proj.length || S.proj.indexOf(t.project)>-1); }).length;
  fdiv.innerHTML='<b>'+esc(FILENAME)+'</b> · '+RAW.length.toLocaleString()+' tickets loaded'+((S.from||S.to||S.proj.length)?' · '+inScopeCount.toLocaleString()+' in scope':'')+' · HD Ticket Trend Tracker';
  main.appendChild(fdiv);
};

/* Rebuild the normalized model from the current raw rows. */
function rebuildFromRows(rawRows){
  RAW_ROWS = rawRows;
  RAW = normalize(rawRows).filter(function(t){return t.key;});
  computeResolvedSpan();   // refresh data-currency span for partial-week detection
}

/* boot — prefer in-app edits; otherwise read the shared Excel and seed the store */
function boot(){
  if(!window.HDStore){ renderLanding(); return; }
  // Load Master Data overrides FIRST — group is baked in at normalize() time, so
  // the status/group maps must be applied before rebuildFromRows() runs.
  HDStore.loadConfig().then(function(cfg){
    window.HDClass.setOverrides(cfg.statusOverrides);
    window.HDGroups.setOverrides(cfg.groupOverrides);
    HDStore.loadFile().then(function(rec){
      if(!rec){ window.location.replace("index.html"); return; }
      FILENAME=rec.name; BLOB=rec.blob;
      HDStore.loadRows().then(function(edited){
        if(edited && edited.length){ rebuildFromRows(edited); render(); return; }
        readFile(rec.blob).then(function(rows){
          rebuildFromRows(rows);
          HDStore.saveRows(rows);
          render();
        }).catch(function(err){ alert("Could not read stored file: "+err.message); window.location.replace("index.html"); });
      });
    });
  });
}
boot();
</script>
