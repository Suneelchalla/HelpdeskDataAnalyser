        </div>

        {/* ══ Footer ══ */}
        <div style={{padding:"9px 20px",borderTop:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg)",flexShrink:0}}>
          <span style={{fontSize:11,color:"var(--t3)",fontWeight:600}}>{allTix.length.toLocaleString()} total tickets · {openTix.length.toLocaleString()} open</span>
          <span style={{fontSize:10,color:"var(--t4)"}}>
            <kbd style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:4,padding:"1px 6px",fontFamily:"var(--mono)",fontSize:10}}>Ctrl+K</kbd> search · <kbd style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:4,padding:"1px 6px",fontFamily:"var(--mono)",fontSize:10}}>ESC</kbd> close
          </span>
        </div>
      </div>
    </div>
  );
}


/* ─── Main App ─── */
/* ═══ EDITABLE DATA GRID ═══
   Spreadsheet-style editor over the raw rows: per-column filters, global
   search, click-to-sort, pagination, add/delete row. "Apply & Recalculate"
   pushes edits back into the dashboard (and the shared store) so every KPI,
   chart and pivot recomputes — no Excel re-upload needed. */
function fmtCell(v){
  if(v===null||v===undefined)return"";
  if(v instanceof Date)return isNaN(v)?"":v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  return String(v);
}
function DataEditor({rows,fileName,onApply,onRevert}){
  const PAGE=50;
  const[data,setData]=useState([]);
  const[dirty,setDirty]=useState(false);
  const[filters,setFilters]=useState({});
  const[search,setSearch]=useState("");
  const[sortCol,setSortCol]=useState(null);
  const[sortDir,setSortDir]=useState("asc");
  const[page,setPage]=useState(0);
  const idRef=useRef(0);

  // (Re)initialise the working copy whenever the source rows change (load / revert)
  useEffect(function(){
    idRef.current=0;
    setData((rows||[]).map(function(r){return Object.assign({__id:idRef.current++},r);}));
    setDirty(false);setPage(0);setFilters({});setSearch("");setSortCol(null);
  },[rows]);

  const cols=useMemo(function(){
    var seen={};var out=[];
    (data||[]).forEach(function(r){Object.keys(r).forEach(function(k){if(k!=="__id"&&!seen[k]){seen[k]=1;out.push(k);}});});
    return out;
  },[data]);

  const view=useMemo(function(){
    var l=data;
    var active=Object.keys(filters).filter(function(k){return filters[k];});
    if(active.length)l=l.filter(function(r){return active.every(function(k){return fmtCell(r[k]).toLowerCase().indexOf(filters[k].toLowerCase())>-1;});});
    if(search){var q=search.toLowerCase();l=l.filter(function(r){return cols.some(function(k){return fmtCell(r[k]).toLowerCase().indexOf(q)>-1;});});}
    if(sortCol){
      l=[].concat(l).sort(function(a,b){
        var av=a[sortCol],bv=b[sortCol];
        if(av instanceof Date&&bv instanceof Date){return sortDir==="asc"?av-bv:bv-av;}
        var as=fmtCell(av),bs=fmtCell(bv);
        var an=parseFloat(as),bn=parseFloat(bs);
        if(!isNaN(an)&&!isNaN(bn)&&as.trim()!==""&&bs.trim()!==""){return sortDir==="asc"?an-bn:bn-an;}
        return sortDir==="asc"?as.localeCompare(bs):bs.localeCompare(as);
      });
    }
    return l;
  },[data,filters,search,sortCol,sortDir,cols]);

  const pageCount=Math.max(1,Math.ceil(view.length/PAGE));
  const cur=Math.min(page,pageCount-1);
  const pageRows=view.slice(cur*PAGE,cur*PAGE+PAGE);

  function edit(id,col,val){setData(function(prev){return prev.map(function(r){return r.__id===id?Object.assign({},r,{[col]:val}):r;});});setDirty(true);}
  function delRow(id){setData(function(prev){return prev.filter(function(r){return r.__id!==id;});});setDirty(true);}
  function addRow(){var blank={__id:idRef.current++};cols.forEach(function(c){blank[c]="";});setData(function(prev){return[blank].concat(prev);});setDirty(true);setPage(0);}
  function toggleSort(c){if(sortCol===c){setSortDir(function(d){return d==="asc"?"desc":"asc";});}else{setSortCol(c);setSortDir("asc");}}
  function setFilter(c,v){setFilters(function(prev){var n=Object.assign({},prev);if(v)n[c]=v;else delete n[c];return n;});setPage(0);}
  function clearFilters(){setFilters({});setSearch("");setPage(0);}
  function apply(){var clean=data.map(function(r){var o={};cols.forEach(function(c){o[c]=r[c];});return o;});onApply(clean);setDirty(false);}

  var hdrStyle={padding:"8px 10px",textAlign:"left",fontSize:10,fontWeight:800,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".4px",borderBottom:"2px solid var(--border2)",background:"var(--bg)",position:"sticky",top:0,zIndex:3,whiteSpace:"nowrap",cursor:"pointer",userSelect:"none"};
  var inpStyle={width:"100%",minWidth:110,border:"1px solid transparent",borderRadius:6,padding:"5px 7px",fontSize:12,color:"var(--t1)",background:"transparent",fontFamily:"var(--sans)"};

  return(<>
    <div className="card" style={{padding:"11px 15px",marginBottom:9,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
      <div style={{width:42,height:42,borderRadius:10,background:"var(--blue-bg)",border:"1px solid var(--blue-light)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>✏️</div>
      <div style={{minWidth:0}}>
        <div style={{fontWeight:800,fontSize:15,color:"var(--t1)"}}>Edit Data {dirty&&<span style={{color:"var(--amber)",fontSize:11,fontWeight:700,marginLeft:6}}>● unsaved edits</span>}</div>
        <div style={{fontSize:12,color:"var(--t2)",marginTop:2}}>{data.length.toLocaleString()} rows · {cols.length} columns · correct any field, then Recalculate. Edits are shared with the Trend Tracker too.</div>
      </div>
      <div style={{flex:1}}/>
      <input value={search} onChange={function(e){setSearch(e.target.value);setPage(0);}} placeholder="🔍 Search all columns…" style={{padding:"8px 12px",border:"1px solid var(--border)",borderRadius:8,fontSize:12,color:"var(--t1)",background:"var(--card)",fontFamily:"var(--sans)",minWidth:200}}/>
      <button onClick={addRow} style={{background:"var(--card)",border:"1px solid var(--border2)",color:"var(--t2)",padding:"8px 14px",borderRadius:8,fontSize:12,fontWeight:600}}>＋ Row</button>
      <button onClick={onRevert} style={{background:"var(--card)",border:"1px solid var(--border2)",color:"var(--t2)",padding:"8px 14px",borderRadius:8,fontSize:12,fontWeight:600}}>↺ Revert to upload</button>
      <button onClick={apply} disabled={!dirty} style={{background:dirty?"var(--blue)":"var(--border)",border:"none",color:"#fff",padding:"8px 18px",borderRadius:8,fontSize:12,fontWeight:800,cursor:dirty?"pointer":"default"}}>⟳ Apply &amp; Recalculate</button>
    </div>

    {(Object.keys(filters).length>0||search)&&(<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,padding:"9px 16px",background:"var(--blue-bg)",borderRadius:8,border:"1px solid var(--blue-light)"}}>
      <span style={{color:"var(--blue-dark)",fontSize:12,fontWeight:600}}>Showing {view.length.toLocaleString()} of {data.length.toLocaleString()} rows</span>
      <button onClick={clearFilters} style={{marginLeft:"auto",background:"var(--blue)",color:"#fff",border:"none",padding:"5px 14px",borderRadius:6,fontSize:10,fontWeight:700}}>✕ Clear filters</button>
    </div>)}

    <div className="card" style={{overflow:"hidden"}}>
      <div style={{overflow:"auto",maxHeight:"62vh"}}>
        <table style={{borderCollapse:"collapse",fontSize:12,minWidth:"100%"}}>
          <thead>
            <tr>
              <th style={Object.assign({},hdrStyle,{left:0,zIndex:4,minWidth:36,textAlign:"center",cursor:"default"})}>#</th>
              {cols.map(function(c){return(<th key={c} onClick={function(){toggleSort(c);}} style={hdrStyle} title="Click to sort">{c} <span style={{color:"var(--blue)",fontSize:9}}>{sortCol===c?(sortDir==="asc"?"↑":"↓"):""}</span></th>);})}
            </tr>
            <tr>
              <th style={{position:"sticky",top:33,left:0,zIndex:4,background:"var(--bg)",borderBottom:"1px solid var(--border)"}}></th>
              {cols.map(function(c){return(<th key={c} style={{position:"sticky",top:33,zIndex:3,background:"var(--bg)",borderBottom:"1px solid var(--border)",padding:"4px 6px"}}>
                <input value={filters[c]||""} onChange={function(e){setFilter(c,e.target.value);}} placeholder="filter…" style={{width:"100%",minWidth:100,border:"1px solid var(--border2)",borderRadius:5,padding:"3px 6px",fontSize:11,color:"var(--t2)",background:"var(--card)",fontFamily:"var(--sans)"}}/>
              </th>);})}
            </tr>
          </thead>
          <tbody>
            {pageRows.map(function(r){return(<tr key={r.__id} style={{borderBottom:"1px solid var(--border)"}}>
              <td style={{position:"sticky",left:0,zIndex:1,background:"var(--card)",padding:"2px 4px",textAlign:"center"}}>
                <button onClick={function(){delRow(r.__id);}} title="Delete row" style={{background:"transparent",border:"none",color:"var(--t4)",fontSize:13,padding:2}}>🗑</button>
              </td>
              {cols.map(function(c){return(<td key={c} style={{padding:0,borderRight:"1px solid var(--bg)"}}>
                <input value={fmtCell(r[c])} onChange={function(e){edit(r.__id,c,e.target.value);}}
                  style={inpStyle}
                  onFocus={function(e){e.target.style.border="1px solid var(--blue)";e.target.style.background="var(--card)";}}
                  onBlur={function(e){e.target.style.border="1px solid transparent";e.target.style.background="transparent";}}/>
              </td>);})}
            </tr>);})}
            {pageRows.length===0&&(<tr><td colSpan={cols.length+1} style={{padding:24,textAlign:"center",color:"var(--t3)",fontSize:12}}>No rows match the current filters.</td></tr>)}
          </tbody>
        </table>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",borderTop:"1px solid var(--border)",background:"var(--bg)"}}>
        <span style={{fontSize:11,color:"var(--t2)"}}>Rows {view.length?cur*PAGE+1:0}–{Math.min(cur*PAGE+PAGE,view.length)} of {view.length.toLocaleString()}</span>
        <div style={{flex:1}}/>
        <button onClick={function(){setPage(0);}} disabled={cur===0} style={{background:"var(--card)",border:"1px solid var(--border2)",color:cur===0?"var(--t4)":"var(--t2)",padding:"5px 10px",borderRadius:6,fontSize:11,fontWeight:600}}>« First</button>
        <button onClick={function(){setPage(cur-1);}} disabled={cur===0} style={{background:"var(--card)",border:"1px solid var(--border2)",color:cur===0?"var(--t4)":"var(--t2)",padding:"5px 10px",borderRadius:6,fontSize:11,fontWeight:600}}>‹ Prev</button>
        <span style={{fontSize:11,color:"var(--t2)",fontWeight:700}}>Page {cur+1} / {pageCount}</span>
        <button onClick={function(){setPage(cur+1);}} disabled={cur>=pageCount-1} style={{background:"var(--card)",border:"1px solid var(--border2)",color:cur>=pageCount-1?"var(--t4)":"var(--t2)",padding:"5px 10px",borderRadius:6,fontSize:11,fontWeight:600}}>Next ›</button>
        <button onClick={function(){setPage(pageCount-1);}} disabled={cur>=pageCount-1} style={{background:"var(--card)",border:"1px solid var(--border2)",color:cur>=pageCount-1?"var(--t4)":"var(--t2)",padding:"5px 10px",borderRadius:6,fontSize:11,fontWeight:600}}>Last »</button>
      </div>
    </div>
  </>);
}

function App(){
  const[raw,setRaw]=useState(null);
  const[w,setW]=useState([]);
  const[tab,setTab]=useState("followup");
  const[cf,setCf]=useState(null);
  const[af,setAf]=useState(null);
  const[sf,setSf]=useState(null);
  const[gf,setGf]=useState(null);
  const[pf,setPf]=useState([]);
  const[svmF,setSvmF]=useState([]); // SVM In Charge filter
  const[itF,setItF]=useState([]);   // Request Type (Issue Type) filter
  const[search,setSearch]=useState("");
  const[sortCol,setSortCol]=useState("age");
  const[sortDir,setSortDir]=useState("desc");
  const[loading,setLoading]=useState(false);
  const[fn,setFn]=useState("");
  const[statusOpen,setStatusOpen]=useState(false);
  const[dtFrom,setDtFrom]=useState("");
  const[dtTo,setDtTo]=useState("");
  const[dtLabel,setDtLabel]=useState("All Time");
  const[modal,setModal]=useState(null); // {title, icon, color, tickets}
  const[catModal,setCatModal]=useState(null); // {tickets, title, subtitle, icon, color, bg, border, badgeColor}
  const[catTab,setCatTab]=useState("all"); // "all" | "ageing" | "svm"
  const[mailModal,setMailModal]=useState(null); // {subject, body}
  const[reminderData,setReminderData]=useState(null); // {ticket, mode}
  const[globalSearchOpen,setGlobalSearchOpen]=useState(false); // Global ticket search (Ctrl+K)
  const fRef=useRef();
  const blobRef=useRef(null); // original uploaded file, kept for "revert"

  const handleFile=useCallback(async function(e){
    const f=e.target.files?.[0];if(!f)return;
    setLoading(true);setFn(f.name);
    try{setRaw(await px(f));setW([]);setCf(null);setAf(null);setSf(null);setGf(null);setPf([]);setSvmF([]);setItF([]);setSearch("");setDtFrom("");setDtTo("");setDtLabel("All Time");setModal(null);}
    catch(err){alert(err.message);}
    setLoading(false);e.target.value="";
  },[]);
  function clr(){setCf(null);setAf(null);setSf(null);setGf(null);setSearch("");}
  function closeModal(){setModal(null);}

  /* Keyboard: Esc closes modal, Ctrl+K opens global search */
  useEffect(function(){
    function handleKey(e){
      if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();setGlobalSearchOpen(true);return;}
      if(e.key==="Escape"){if(globalSearchOpen)setGlobalSearchOpen(false);else if(reminderData)setReminderData(null);else if(mailModal)setMailModal(null);else if(catModal)setCatModal(null);else if(modal)setModal(null);}
    }
    document.addEventListener("keydown",handleKey);
    return function(){document.removeEventListener("keydown",handleKey);};
  },[modal,catModal,globalSearchOpen,reminderData,mailModal]);

  /* Load the shared data. Prefer in-app edits (from the Edit Data tab); fall
     back to parsing the uploaded Excel and seeding the edit store from it. */
  useEffect(function(){
    if(!window.HDStore)return;
    // Apply Master Data status overrides before rendering so classify() reflects them.
    window.HDStore.loadConfig().then(function(cfg){
      window.HDClass.setOverrides(cfg.statusOverrides);
      window.HDStore.loadFile().then(function(rec){
        if(!rec){window.location.replace("index.html");return;}
        setFn(rec.name);blobRef.current=rec.blob;setLoading(true);
        window.HDStore.loadRows().then(function(edited){
          if(edited&&edited.length){setRaw(edited);setLoading(false);return;}
          px(rec.blob).then(function(rows){setRaw(rows);setLoading(false);window.HDStore.saveRows(rows);})
            .catch(function(e){alert("Could not read stored file: "+e.message);window.location.replace("index.html");});
        });
      });
    });
  },[]);

  /* Commit edits from the Edit Data tab: everything recomputes off `raw`. */
  function applyEditedRows(newRows){
    setRaw(newRows);setW([]);setCf(null);setAf(null);setSf(null);setGf(null);setPf([]);setSvmF([]);setItF([]);setSearch("");setModal(null);
    if(window.HDStore)window.HDStore.saveRows(newRows);
  }
  /* Throw away edits and reload the originally uploaded file. */
  function revertToUpload(){
    if(!blobRef.current)return;
    if(window.HDStore)window.HDStore.clearRows();
    setLoading(true);
    px(blobRef.current).then(function(rows){setRaw(rows);setLoading(false);if(window.HDStore)window.HDStore.saveRows(rows);});
  }

  /* SLA, Priority, and modal openers — defined after flt (below) */

  /* Open modal with filtered tickets */
  function openCatModal(c){
    var label=CL[c];var cs=CS[c];
    var tix=flt.filter(function(t){return classify(t.Status)===c&&t.Status!=="On-Hold"&&t.Status!=="Invoice Yet to Raise";});
    tix.sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:label,icon:cs.icon,color:cs.badge,tickets:tix});
  }
  function openHoldModal(){
    var tix=st.hold.slice().sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:"On-Hold tickets",icon:"⏸️",color:"#64748B",tickets:tix});
  }
  function openInvoiceModal(){
    var tix=st.inv.slice().sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:"Invoice Yet to Raise",icon:"🧾",color:"#0891B2",tickets:tix});
  }
  function openEnggModal(){
    var tix=flt.filter(function(t){return classify(t.Status)==="engg"&&t.Status!=="On-Hold"&&t.Status!=="Invoice Yet to Raise";});
    tix.sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setCatModal({tickets:tix,title:"Engineering Followup",subtitle:tix.length+" ticket"+(tix.length!==1?"s":"")+" with engineering / dev",icon:"🔧",color:"var(--violet)",bg:"var(--violet-bg)",border:"var(--violet-border)",badgeColor:"#7C3AED",showReport:true});setCatTab("all");
  }
  function openClientModal(){
    var tix=flt.filter(function(t){return classify(t.Status)==="client"&&t.Status!=="On-Hold"&&t.Status!=="Invoice Yet to Raise";});
    tix.sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setCatModal({tickets:tix,title:"Client Followup",subtitle:tix.length+" ticket"+(tix.length!==1?"s":"")+" awaiting client response",icon:"💬",color:"var(--amber)",bg:"var(--amber-bg)",border:"var(--amber-border)",badgeColor:"#D97706",showClientReport:true});setCatTab("all");
  }
  function closeCatModal(){setCatModal(null);}
  function openAgeModal(i){
    var tix=flt.filter(function(t){return abk(ds(t.Updated||t.Created))===i;});
    tix.sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:AL[i]+" old tickets",icon:"⏰",color:AC[i],tickets:tix});
  }
  function openStatusModal(s){
    var c=classify(s);var cs=CS[c];
    var tix=flt.filter(function(t){return t.Status===s;});
    tix.sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:s,icon:cs.icon,color:cs.badge,tickets:tix});
  }
  function openAllModal(){
    var tix=[].concat(flt).sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:"All Open Tickets",icon:"📂",color:"#2563EB",tickets:tix});
  }
  function openDangerModal(){
    var tix=flt.filter(function(t){return abk(ds(t.Updated||t.Created))===4;});
    tix.sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:"Danger Zone — 90+ days",icon:"🔴",color:"#E11D48",tickets:tix});
  }

  /* === Report & Mail actions === */
  function getEnggTickets(){return flt.filter(function(t){var it=t["Issue Type"]||"";return classify(t.Status)==="engg"&&t.Status!=="On-Hold"&&t.Status!=="Invoice Yet to Raise"&&it!=="Change Request"&&it!=="Change";});}
  function openEnggReport(){generateEnggReport({tickets:getEnggTickets(),fn:fn,w:w,pf:pf});}
  function openEnggMail(){setMailModal(buildEnggMailDraft({tickets:getEnggTickets(),fn:fn,w:w,pf:pf}));}
  function openDailyReport(){generateDailyReport({flt:flt,st:st,slaData:slaData,prioDist:prioDist,fn:fn,w:w,pf:pf});}
  function openDailyMail(){setMailModal(buildDailyMailDraft({st:st,slaData:slaData,prioDist:prioDist,flt:flt,fn:fn}));}
  function handleClientReport(proj,tickets){generateClientReport({project:proj,tickets:tickets,fn:fn});}
  function handleClientMail(proj,tickets){setMailModal(buildClientMailDraft({project:proj,tickets:tickets}));}

  function filterCat(c){setCf(function(prev){return prev===c?null:c;});setAf(null);setSf(null);setSearch("");}
  function filterAge(i){setAf(function(prev){return prev===i?null:i;});setCf(null);setSf(null);setSearch("");}
  function filterStatus(s){setSf(function(prev){return prev===s?null:s;});setCf(null);setAf(null);setSearch("");}
  function filterGap(f){setGf(function(prev){return prev===f?null:f;});}
  function toggleSort(col){if(sortCol===col){setSortDir(function(d){return d==="asc"?"desc":"asc";});}else{setSortCol(col);setSortDir("desc");}}
  function sortIcon(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):"";};

  /* Date range presets */
  function setDatePreset(label,from,to){setDtFrom(from||"");setDtTo(to||"");setDtLabel(label);clr();}
  function presetAllTime(){setDatePreset("All Time","","");}
  function presetThisMonth(){var d=new Date();var y=d.getFullYear();var m=String(d.getMonth()+1).padStart(2,"0");setDatePreset("This Month",y+"-"+m+"-01","");}
  function presetLastMonth(){var d=new Date();d.setMonth(d.getMonth()-1);var y=d.getFullYear();var m=String(d.getMonth()+1).padStart(2,"0");var last=new Date(y,d.getMonth()+1,0).getDate();setDatePreset("Last Month",y+"-"+m+"-01",y+"-"+m+"-"+String(last).padStart(2,"0"));}
  function presetLast3M(){var d=new Date();d.setMonth(d.getMonth()-3);setDatePreset("Last 3 Months",d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),"");}
  function presetLast6M(){var d=new Date();d.setMonth(d.getMonth()-6);setDatePreset("Last 6 Months",d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),"");}
  function presetThisYear(){var y=new Date().getFullYear();setDatePreset("This Year",y+"-01-01","");}
  function presetLastYear(){var y=new Date().getFullYear()-1;setDatePreset("Last Year",y+"-01-01",y+"-12-31");}

  /* Date-filtered data — applies to EVERYTHING */
  var dateFiltered=useMemo(function(){
    if(!raw)return[];
    if(!dtFrom&&!dtTo)return raw;
    var fromMs=dtFrom?new Date(dtFrom+"T00:00:00").getTime():-Infinity;
    var toMs=dtTo?new Date(dtTo+"T23:59:59").getTime():Infinity;
    return raw.filter(function(t){
      if(!t.Created)return false;
      var d=t.Created instanceof Date?t.Created:new Date(t.Created);
      if(isNaN(d))return false;
      var ms=d.getTime();
      return ms>=fromMs&&ms<=toMs;
    });
  },[raw,dtFrom,dtTo]);

  var dateRangeText=useMemo(function(){
    if(!dtFrom&&!dtTo)return"";
    var parts=[];
    if(dtFrom)parts.push("from "+fd(new Date(dtFrom)));
    if(dtTo)parts.push("to "+fd(new Date(dtTo)));
    return parts.join(" ");
  },[dtFrom,dtTo]);

  const op=useMemo(()=>dateFiltered?dateFiltered.filter(r=>r.Status&&r.Status!=="Closed"&&isFollowupType(r)):[],[dateFiltered]);
  const totalCreated=useMemo(function(){return dateFiltered?dateFiltered.length:0;},[dateFiltered]);
  const totalClosed=useMemo(function(){return dateFiltered?dateFiltered.filter(function(t){return t.Status==="Closed";}).length:0;},[dateFiltered]);
  const wks=useMemo(()=>{const m={};op.forEach(t=>{const x=t["Current Worker"];if(x)m[x]=(m[x]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);},[op]);
  const pjs=useMemo(()=>{const s=new Set();op.forEach(t=>{if(t.Project)s.add(t.Project)});return[...s].sort();},[op]);
  /* Global filter option lists (from the scoped open set) */
  const svmNorm=function(t){var s=String(t["SVM In Charge"]||"").trim();return(!s||s.toLowerCase()==="nan")?"(Unassigned)":s;};
  const svms=useMemo(()=>{const m={};op.forEach(t=>{const s=svmNorm(t);m[s]=(m[s]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);},[op]);
  const itypes=useMemo(()=>{const m={};op.forEach(t=>{const it=t["Issue Type"]||"(None)";m[it]=(m[it]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);},[op]);

  const flt=useMemo(()=>{
    let l=op;
    if(w.length)l=l.filter(t=>w.indexOf(t["Current Worker"])>-1);
    if(pf.length)l=l.filter(t=>pf.indexOf(t.Project)>-1);
    if(svmF.length)l=l.filter(t=>svmF.indexOf(svmNorm(t))>-1);
    if(itF.length)l=l.filter(t=>itF.indexOf(t["Issue Type"]||"(None)")>-1);
    return l;
  },[op,w,pf,svmF,itF]);

  /* All tickets filtered by the global filters (includes closed) for SLA — scoped to Incidents/SRs */
  var allFiltered=useMemo(function(){
    var l=(dateFiltered||[]).filter(isFollowupType);
    if(w.length)l=l.filter(function(t){return w.indexOf(t["Current Worker"])>-1;});
    if(pf.length)l=l.filter(function(t){return pf.indexOf(t.Project)>-1;});
    if(svmF.length)l=l.filter(function(t){return svmF.indexOf(svmNorm(t))>-1;});
    if(itF.length)l=l.filter(function(t){return itF.indexOf(t["Issue Type"]||"(None)")>-1;});
    return l;
  },[dateFiltered,w,pf,svmF,itF]);

  /* SLA breach computation — against ALL tickets in range */
  var slaData=useMemo(function(){
    var frBreached=[];var resBreached=[];var allBreached=[];
    var frTotal=0;var resTotal=0;
    allFiltered.forEach(function(t){
      var s=checkSLA(t);
      var frH=parseTimeToHours(t["Time to first response"]);
      var resH=parseTimeToHours(t["Time to resolution"]);
      if(frH!==null)frTotal++;
      if(resH!==null)resTotal++;
      if(s.frBreach)frBreached.push(Object.assign({},t,{_sla:s}));
      if(s.resBreach)resBreached.push(Object.assign({},t,{_sla:s}));
      if(s.anyBreach)allBreached.push(Object.assign({},t,{_sla:s}));
    });
    var frRate=frTotal>0?Math.round((frTotal-frBreached.length)/frTotal*100):100;
    var resRate=resTotal>0?Math.round((resTotal-resBreached.length)/resTotal*100):100;
    return{all:allBreached,fr:frBreached,res:resBreached,frTotal:frTotal,resTotal:resTotal,frRate:frRate,resRate:resRate,total:allFiltered.length};
  },[allFiltered]);

  /* Priority distribution — against open tickets */
  var prioDist=useMemo(function(){
    var counts={"Show Stopper":0,"Critical":0,"High":0,"Medium":0,"Low":0};
    flt.forEach(function(t){var p=t.Priority;if(counts.hasOwnProperty(p))counts[p]++;else counts["Medium"]++;});
    return counts;
  },[flt]);

  function openSLAModal(){
    var tix=[].concat(slaData.all).sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:"SLA Breached Tickets ("+tix.length+")",icon:"⚡",color:"#E11D48",tickets:tix});
  }
  function openSLAFRModal(){
    var tix=[].concat(slaData.fr).sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:"First Response SLA Breached ("+tix.length+")",icon:"⚡",color:"#E11D48",tickets:tix});
  }
  function openSLAResModal(){
    var tix=[].concat(slaData.res).sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:"Resolution SLA Breached ("+tix.length+")",icon:"⚡",color:"#D97706",tickets:tix});
  }
  function openPriorityModal(p){
    var tix=flt.filter(function(t){return t.Priority===p;}).sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:p+" Priority Tickets",icon:"🔷",color:PRIORITY_COLORS[p]||"#2563EB",tickets:tix});
  }

  /* Performance modal openers */
  function perfModal(title,icon,color,filterFn){
    var src=allFiltered||[];
    var tix=src.filter(filterFn).sort(function(a,b){return ds(b.Updated||b.Created)-ds(a.Updated||a.Created);});
    setModal({title:title+" ("+tix.length+")",icon:icon,color:color,tickets:tix});
  }
  function pmAll(){perfModal("All Handled","📋","#2563EB",function(){return true;});}
  function pmClosed(){perfModal("Closed Tickets","✅","#059669",function(t){return t.Status==="Closed";});}
  function pmOpen(){perfModal("Open Tickets","📂","#D97706",function(t){return t.Status!=="Closed";});}
  function pmHdOnly(){perfModal("Closed by HD (No LRPS)","🎯","#059669",function(t){var li=t["Linked Issues"];return t.Status==="Closed"&&(!li||String(li).trim()===""||String(li).toLowerCase()==="nan");});}
  function pmEngAsst(){perfModal("Closed with Engg (LRPS)","🔧","#7C3AED",function(t){var li=t["Linked Issues"];return t.Status==="Closed"&&li&&String(li).trim()!==""&&String(li).toLowerCase()!=="nan";});}
  function pmIncClarHd(){perfModal("Incidents — Clarification — Closed by HD","🎯","#059669",function(t){var li=t["Linked Issues"];return t.Status==="Closed"&&t["Issue Type"]==="Incident"&&t["Root Cause"]==="Client Clarification"&&(!li||String(li).trim()===""||String(li).toLowerCase()==="nan");});}
  function pmIncClarEng(){perfModal("Incidents — Clarification — Engg Assisted","🔧","#7C3AED",function(t){var li=t["Linked Issues"];return t.Status==="Closed"&&t["Issue Type"]==="Incident"&&t["Root Cause"]==="Client Clarification"&&li&&String(li).trim()!==""&&String(li).toLowerCase()!=="nan";});}
  function pmIncidents(){perfModal("All Incidents","📋","#2563EB",function(t){return t["Issue Type"]==="Incident";});}
  function pmIncClar(){perfModal("Incidents — Client Clarification","📋","#0891B2",function(t){return t["Issue Type"]==="Incident"&&t["Root Cause"]==="Client Clarification";});}

  /* Incident + Clarification breakdown computation */
  var incClarData=useMemo(function(){
    var src=allFiltered||[];
    if(w.length)src=src.filter(function(t){return w.indexOf(t["Current Worker"])>-1;});
    if(pf.length)src=src.filter(function(t){return pf.indexOf(t.Project)>-1;});
    var incidents=src.filter(function(t){return t["Issue Type"]==="Incident";});
    var incClosed=incidents.filter(function(t){return t.Status==="Closed";});
    var incClar=incidents.filter(function(t){return t["Root Cause"]==="Client Clarification";});
    var incClarClosed=incClar.filter(function(t){return t.Status==="Closed";});
    var hdOnly=0;var engAsst=0;
    incClarClosed.forEach(function(t){var li=t["Linked Issues"];var has=li&&String(li).trim()!==""&&String(li).toLowerCase()!=="nan";if(has)engAsst++;else hdOnly++;});
    return{incidents:incidents.length,incClosed:incClosed.length,incClar:incClar.length,incClarClosed:incClarClosed.length,hdOnly:hdOnly,engAsst:engAsst};
  },[allFiltered,w,pf]);

  const st=useMemo(()=>{
    const hd=[],cl=[],eng=[],hold=[],inv=[];const bk=[0,0,0,0,0];const sm={};const pm={};let ta=0;
    flt.forEach(t=>{
      if(t.Status==="On-Hold"){hold.push(t);}
      else if(t.Status==="Invoice Yet to Raise"){inv.push(t);}
      else{
        const c=classify(t.Status);
        if(c==="hd")hd.push(t);
        else if(c==="engg")eng.push(t);
        else cl.push(t);
      }
      const a=ds(t.Updated||t.Created);bk[abk(a)]++;ta+=a;
      sm[t.Status]=(sm[t.Status]||0)+1;pm[t.Project]=(pm[t.Project]||0)+1;
    });
    return{n:flt.length,hd,cl,eng,hold,inv,avg:flt.length?Math.round(ta/flt.length):0,bk,dng:bk[4],sm,pm};
  },[flt]);

  const disp=useMemo(()=>{
    let l=flt;
    if(cf)l=l.filter(t=>classify(t.Status)===cf);
    if(af!==null)l=l.filter(t=>abk(ds(t.Updated||t.Created))===af);
    if(sf)l=l.filter(t=>t.Status===sf);
    if(search){const s=search.toLowerCase();l=l.filter(t=>(t.Key||"").toLowerCase().includes(s)||(t.Summary||"").toLowerCase().includes(s));}
    // Sort
    l=[...l];
    const dir=sortDir==="asc"?1:-1;
    l.sort((a,b)=>{
      if(sortCol==="age")return dir*(ds(b.Updated||b.Created)-ds(a.Updated||a.Created));
      if(sortCol==="key")return dir*(a.Key||"").localeCompare(b.Key||"");
      if(sortCol==="status")return dir*(a.Status||"").localeCompare(b.Status||"");
      if(sortCol==="priority"){const po={Critical:0,"Show Stopper":0,High:1,Medium:2,Low:3};return dir*((po[a.Priority]??4)-(po[b.Priority]??4));}
      if(sortCol==="created")return dir*(ds(b.Created)-ds(a.Created));
      if(sortCol==="project")return dir*(a.Project||"").localeCompare(b.Project||"");
      return 0;
    });
    return l;
  },[flt,cf,af,sf,search,sortCol,sortDir]);

  /* Performance */
  const perf=useMemo(()=>{
    if(!dateFiltered||w.length!==1)return null;
    const all=dateFiltered.filter(t=>t["Current Worker"]===w[0]);const closed=all.filter(t=>t.Status==="Closed");const openT=all.length-closed.length;
    const rate=all.length?Math.round(closed.length/all.length*100):0;
    const rd=[];closed.forEach(t=>{if(t.Resolved&&t.Created){const d=Math.abs(ds(t.Created)-ds(t.Resolved));if(d<1000)rd.push(d);}});
    const avgR=rd.length?Math.round(rd.reduce((a,b)=>a+b,0)/rd.length):0;
    const mo={};all.forEach(t=>{if(t.Created){const m=fm(t.Created);if(m){if(!mo[m])mo[m]={cr:0,cl:0};mo[m].cr++;}}});
    closed.forEach(t=>{if(t.Resolved){const m=fm(t.Resolved);if(m&&mo[m])mo[m].cl++;}});
    const months=Object.entries(mo).slice(-12);
    const bp={};all.forEach(t=>{if(t.Project){if(!bp[t.Project])bp[t.Project]={t:0,c:0};bp[t.Project].t++;}});
    closed.forEach(t=>{if(t.Project&&bp[t.Project])bp[t.Project].c++;});
    const tp=Object.entries(bp).sort((a,b)=>b[1].t-a[1].t).slice(0,8);
    const bf={};all.forEach(t=>{const f=t["Type of Fix"];if(f&&f!=="nan")bf[f]=(bf[f]||0)+1;});
    const tf=Object.entries(bf).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const br={};all.forEach(t=>{const r=t["Root Cause"];if(r&&r!=="nan")br[r]=(br[r]||0)+1;});
    const tr=Object.entries(br).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const bt={};all.forEach(t=>{if(t["Issue Type"])bt[t["Issue Type"]]=(bt[t["Issue Type"]]||0)+1;});
    const san=closed.filter(t=>t["Sanity Test Done"]==="Yes").length;
    // HD-only (no LRPS) vs Engg-assisted (has LRPS)
    var hdOnly=0;var engAsst=0;
    closed.forEach(function(t){var li=t["Linked Issues"];var hasLRPS=li&&String(li).trim()!==""&&String(li).toLowerCase()!=="nan";if(hasLRPS)engAsst++;else hdOnly++;});
    var allHdOnly=0;var allEngAsst=0;
    all.forEach(function(t){var li=t["Linked Issues"];var hasLRPS=li&&String(li).trim()!==""&&String(li).toLowerCase()!=="nan";if(hasLRPS)allEngAsst++;else allHdOnly++;});
    return{all:all.length,cl:closed.length,op:openT,rate,avgR,months,tp,tf,tr,bt,san,hdOnly:hdOnly,engAsst:engAsst,allHdOnly:allHdOnly,allEngAsst:allEngAsst};
  },[dateFiltered,w]);
  const tAvg=useMemo(()=>{if(!dateFiltered)return{r:0};const m={};dateFiltered.forEach(t=>{const x=t["Current Worker"];if(x){if(!m[x])m[x]={t:0,c:0};m[x].t++;}});dateFiltered.filter(t=>t.Status==="Closed").forEach(t=>{const x=t["Current Worker"];if(x&&m[x])m[x].c++;});const rs=Object.values(m).filter(v=>v.t>=10).map(v=>Math.round(v.c/v.t*100));return{r:rs.length?Math.round(rs.reduce((a,b)=>a+b,0)/rs.length):0};},[dateFiltered]);

  /* Team-level consolidated performance */
  const teamPerf=useMemo(function(){
    if(!dateFiltered||!dateFiltered.length)return null;
    var all=dateFiltered;var closed=all.filter(function(t){return t.Status==="Closed";});var openT=all.length-closed.length;
    var rate=all.length?Math.round(closed.length/all.length*100):0;
    var rd=[];closed.forEach(function(t){if(t.Resolved&&t.Created){var d=Math.abs(ds(t.Created)-ds(t.Resolved));if(d<1000)rd.push(d);}});
    var avgR=rd.length?Math.round(rd.reduce(function(a,b){return a+b;},0)/rd.length):0;
    // Monthly trend
    var mo={};all.forEach(function(t){if(t.Created){var m=fm(t.Created);if(m){if(!mo[m])mo[m]={cr:0,cl:0};mo[m].cr++;}}});
    closed.forEach(function(t){if(t.Resolved){var m=fm(t.Resolved);if(m&&mo[m])mo[m].cl++;}});
    var months=Object.entries(mo).slice(-12);
    // By project
    var bp={};all.forEach(function(t){if(t.Project){if(!bp[t.Project])bp[t.Project]={t:0,c:0};bp[t.Project].t++;}});
    closed.forEach(function(t){if(t.Project&&bp[t.Project])bp[t.Project].c++;});
    var tp=Object.entries(bp).sort(function(a,b){return b[1].t-a[1].t;}).slice(0,10);
    // By fix type
    var bf={};all.forEach(function(t){var f=t["Type of Fix"];if(f&&f!=="nan")bf[f]=(bf[f]||0)+1;});
    var tf=Object.entries(bf).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
    // By root cause
    var br={};all.forEach(function(t){var r=t["Root Cause"];if(r&&r!=="nan")br[r]=(br[r]||0)+1;});
    var tr=Object.entries(br).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
    // By issue type
    var bt={};all.forEach(function(t){if(t["Issue Type"])bt[t["Issue Type"]]=(bt[t["Issue Type"]]||0)+1;});
    // Per-worker leaderboard
    var wm={};all.forEach(function(t){var x=t["Current Worker"];if(x){if(!wm[x])wm[x]={t:0,c:0,san:0,hdOnly:0,engAsst:0};wm[x].t++;}});
    closed.forEach(function(t){var x=t["Current Worker"];if(x&&wm[x]){wm[x].c++;if(t["Sanity Test Done"]==="Yes")wm[x].san++;var li=t["Linked Issues"];var hasLRPS=li&&String(li).trim()!==""&&String(li).toLowerCase()!=="nan";if(hasLRPS)wm[x].engAsst++;else wm[x].hdOnly++;}});
    var wl=Object.entries(wm).map(function(e){return{name:e[0],total:e[1].t,closed:e[1].c,san:e[1].san,hdOnly:e[1].hdOnly,engAsst:e[1].engAsst,rate:e[1].t?Math.round(e[1].c/e[1].t*100):0};}).sort(function(a,b){return b.total-a.total;});
    var san=closed.filter(function(t){return t["Sanity Test Done"]==="Yes";}).length;
    // HD-only vs Engg-assisted totals
    var hdOnlyTotal=0;var engAsstTotal=0;
    closed.forEach(function(t){var li=t["Linked Issues"];var hasLRPS=li&&String(li).trim()!==""&&String(li).toLowerCase()!=="nan";if(hasLRPS)engAsstTotal++;else hdOnlyTotal++;});
    return{all:all.length,cl:closed.length,op:openT,rate:rate,avgR:avgR,months:months,tp:tp,tf:tf,tr:tr,bt:bt,san:san,wl:wl,hdOnly:hdOnlyTotal,engAsst:engAsstTotal};
  },[dateFiltered]);

  /* Data Gaps */
  const GF=["Root Cause","Components","SVM In Charge"];
  const gd=useMemo(()=>{if(!dateFiltered)return{t:[],s:{}};let l=dateFiltered.filter(isFollowupType);if(w.length)l=l.filter(t=>w.indexOf(t["Current Worker"])>-1);if(pf.length)l=l.filter(t=>pf.indexOf(t.Project)>-1);if(svmF.length)l=l.filter(t=>svmF.indexOf(svmNorm(t))>-1);if(itF.length)l=l.filter(t=>itF.indexOf(t["Issue Type"]||"(None)")>-1);
    const ct={};GF.forEach(f=>ct[f]=0);const tx=[];
    l.forEach(t=>{const g=GF.filter(f=>{const v=t[f];return!v||String(v).trim()===""||String(v).trim().toLowerCase()==="nan";});if(g.length){g.forEach(x=>ct[x]++);tx.push({...t,_g:g});}});
    return{t:tx,s:ct};
  },[dateFiltered,w,pf,svmF,itF]);
  const dg=useMemo(()=>gf?gd.t.filter(t=>t._g.includes(gf)):gd.t,[gd,gf]);

  /* No inline upload — the file is uploaded once on the launcher (index.html)
     and shared via IndexedDB. Show a small loading state until it arrives. */
  if(!raw) return(
    <div style={{height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,background:"var(--bg)"}}>
      <Logo size={48}/>
      <div style={{fontSize:15,fontWeight:700,color:"var(--t1)"}}>{loading?"Loading your data…":"Opening…"}</div>
      <div style={{fontSize:12,color:"var(--t3)"}}>Nothing loading? <a href="index.html" style={{color:"var(--blue)",fontWeight:600}}>Go to upload</a>.</div>
    </div>
  );

  const hasF=cf||af!==null||sf||search;

  /* Sortable header helper */
  function TH(props){var col=props.col,children=props.children,align=props.align;return(<th onClick={function(){toggleSort(col);}} style={{cursor:"pointer",userSelect:"none",textAlign:align||"left",padding:"7px 10px",fontSize:10,fontWeight:700,color:"var(--t3)",textTransform:"uppercase",letterSpacing:".7px",borderBottom:"2px solid var(--border)",background:"var(--bg)",position:"sticky",top:0,zIndex:2,whiteSpace:"nowrap"}}>
    {children} <span style={{color:"var(--blue)",fontSize:9}}>{sortIcon(col)}</span>
  </th>);}

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)"}}>
      {/* ─── Header ─── */}
      <header style={{background:"#FFFFFF",borderBottom:"1px solid var(--border)",padding:"0 24px",height:50,display:"flex",alignItems:"center",gap:14,position:"sticky",top:0,zIndex:100,boxShadow:"0 1px 3px rgba(0,0,0,.04)"}}>
        <Logo size={30}/>
        <span style={{fontWeight:800,fontSize:15,color:"var(--t1)",letterSpacing:"-.2px"}}>HD Tracker</span>
        <div style={{width:1,height:28,background:"var(--border)",margin:"0 6px"}}/>

        <MultiSelect allLabel={"All Workers · "+op.length+" open"} options={wks.map(function(x){return [x[0],x[1]];})} selected={w} onChange={function(v){setW(v);clr();}} minWidth={240}/>
        <MultiSelect allLabel="All Projects" options={pjs.map(function(p){return [p];})} selected={pf} onChange={function(v){setPf(v);clr();}} minWidth={170}/>
        <MultiSelect allLabel="All In-Charge" options={svms.map(function(x){return [x[0],x[1]];})} selected={svmF} onChange={function(v){setSvmF(v);clr();}} minWidth={160}/>
        <MultiSelect allLabel="All Request Types" options={itypes.map(function(x){return [x[0],x[1]];})} selected={itF} onChange={function(v){setItF(v);clr();}} minWidth={170}/>
        <div style={{flex:1}}/>

        {/* Global search trigger */}
        <button onClick={function(){setGlobalSearchOpen(true);}} title="Search tickets (Ctrl+K)"
          style={{background:"var(--bg)",border:"1px solid var(--border)",color:"var(--t2)",padding:"7px 16px",borderRadius:10,fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:8,whiteSpace:"nowrap",minWidth:180,transition:"all .18s"}}
          onMouseOver={function(e){e.currentTarget.style.borderColor="var(--blue)";e.currentTarget.style.color="var(--blue)";}}
          onMouseOut={function(e){e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.color="var(--t2)";}}>
          <span style={{fontSize:13}}>🔍</span> Search tickets…
          <kbd style={{marginLeft:"auto",background:"var(--card)",border:"1px solid var(--border)",borderRadius:4,padding:"1px 6px",fontSize:9,fontWeight:700,color:"var(--t4)",fontFamily:"var(--mono)"}}>⌘K</kbd>
        </button>

        <nav style={{display:"flex",background:"var(--bg)",borderRadius:10,padding:3,gap:2,border:"1px solid var(--border)"}}>
          {[["followup","📌 Follow-ups",op.length],["gaps","⚠️ Data Gaps",gd.t.length],["data","✏️ Edit Data",raw?raw.length:0]].map(function(x){var id=x[0],lb=x[1],cnt=x[2];return(
            <button key={id} onClick={function(){setTab(id);clr();}} style={{background:tab===id?"var(--blue)":"transparent",color:tab===id?"#fff":"var(--t3)",border:"none",padding:"7px 16px",borderRadius:8,fontSize:11,fontWeight:700,display:"flex",alignItems:"center",gap:5}}>
              {lb} <span style={{background:tab===id?"rgba(255,255,255,.2)":"rgba(0,0,0,.06)",padding:"1px 6px",borderRadius:10,fontSize:10,fontWeight:800}}>{cnt}</span>
            </button>
          );})}
        </nav>
        <button onClick={function(){window.location.href="index.html";}} style={{background:"var(--bg)",border:"1px solid var(--border)",color:"var(--t2)",padding:"7px 14px",borderRadius:8,fontSize:11,fontWeight:600}}>← Launcher</button>
        <input type="file" accept=".xlsx,.xls" ref={fRef} onChange={handleFile}/>
      </header>

      {/* ─── Date Range Filter Bar ─── */}
      {tab!=="data"&&<div style={{background:"#FFFFFF",borderBottom:"1px solid var(--border)",padding:"7px 24px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",position:"sticky",top:50,zIndex:99}}>
        <span style={{fontSize:11,fontWeight:700,color:"var(--t3)",textTransform:"uppercase",letterSpacing:".5px",marginRight:4}}>📅 Date Range</span>

        {/* Preset buttons */}
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
          {[
            ["All Time",presetAllTime],
            ["This Month",presetThisMonth],
            ["Last Month",presetLastMonth],
            ["Last 3M",presetLast3M],
            ["Last 6M",presetLast6M],
            ["This Year",presetThisYear],
            ["Last Year",presetLastYear]
          ].map(function(x){var label=x[0],fn=x[1];var active=dtLabel===label;
            return(<button key={label} onClick={fn} style={{
              padding:"5px 12px",borderRadius:6,fontSize:11,fontWeight:600,border:"1px solid "+(active?"var(--blue)":"var(--border)"),
              background:active?"var(--blue)":"var(--card)",color:active?"#fff":"var(--t2)",transition:"all .15s"
            }}>{label}</button>);
          })}
        </div>

        <div style={{width:1,height:24,background:"var(--border)",margin:"0 6px"}}/>

        {/* Custom date inputs */}
        <span style={{fontSize:11,color:"var(--t3)",fontWeight:500}}>Custom:</span>
        <input type="date" value={dtFrom} onChange={function(e){setDtFrom(e.target.value);setDtLabel("Custom");clr();}}
          style={{padding:"5px 10px",border:"1px solid var(--border)",borderRadius:6,fontSize:11,color:"var(--t1)",background:"var(--card)",fontFamily:"var(--sans)"}}/>
        <span style={{fontSize:11,color:"var(--t3)"}}>→</span>
        <input type="date" value={dtTo} onChange={function(e){setDtTo(e.target.value);setDtLabel("Custom");clr();}}
          style={{padding:"5px 10px",border:"1px solid var(--border)",borderRadius:6,fontSize:11,color:"var(--t1)",background:"var(--card)",fontFamily:"var(--sans)"}}/>

        {(dtFrom||dtTo) && (
          <span style={{display:"inline-flex",alignItems:"center",gap:7,background:"var(--blue-bg)",border:"1px solid var(--blue-light)",padding:"5px 13px",borderRadius:8,fontSize:11.5,fontWeight:700,color:"var(--blue)",whiteSpace:"nowrap",marginLeft:4}}>
            {dtFrom?fd(new Date(dtFrom)):"start"} → {dtTo?fd(new Date(dtTo)):"now"}
            <span style={{color:"var(--t2)",fontWeight:600}}> · {dateFiltered.length.toLocaleString()} records</span>
          </span>
        )}
      </div>}

      <main style={{padding:"12px 24px 30px",maxWidth:tab==="data"?"none":1800,margin:"0 auto"}}>

            {st.hd.length>0&&<> · <b style={{color:"var(--cyan)"}}>{st.hd.length} need action</b></>}
            {st.cl.length>0&&<> · <b onClick={function(){openClientModal();}} style={{color:"var(--amber)",cursor:"pointer",background:"var(--amber-bg)",border:"1px solid var(--amber-border)",padding:"2px 10px",borderRadius:8,fontSize:14,fontWeight:800,letterSpacing:"-.3px"}}>{st.cl.length} awaiting client</b></>}

            {!w.length&&!pf.length&&<>. Select a worker to drill down.</>}

            <div style={{width:42,height:42,borderRadius:10,background:"#fff",border:"1px solid var(--cyan-border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>🎯</div>
            <div style={{flex:1}}><div style={{color:"var(--cyan)",fontWeight:800,fontSize:14}}>{st.hd.length} ticket{st.hd.length!==1?"s":""} need YOUR action</div>
            <div style={{color:"var(--t2)",fontSize:12,marginTop:2}}>Open / Acknowledged / Analysis — act to progress these.</div></div>
            <button onClick={function(){openCatModal("hd");}} style={{background:"var(--cyan)",color:"#fff",border:"none",padding:"9px 18px",borderRadius:8,fontSize:12,fontWeight:700,flexShrink:0}}>View →</button>
          </div>
        )}
        {w.length>0&&st.dng>0&&(
          <div className="fu fu1 card" style={{padding:"11px 18px",marginBottom:8,display:"flex",alignItems:"center",gap:16,borderColor:"var(--rose-border)",background:"var(--rose-bg)"}}>
            <div style={{width:42,height:42,borderRadius:10,background:"#fff",border:"1px solid var(--rose-border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>⏰</div>

          </div>

        {(function(){

              <span style={{fontSize:20}}>🔥</span><div><div style={{color:"var(--rose)",fontWeight:800,fontSize:13.5}}>{fires.length} fire{fires.length!==1?"s":""} — high priority &amp; ageing</div><div style={{color:"var(--t2)",fontSize:11.5,marginTop:1}}>Show Stopper / Critical open over 14 days — tackle first.</div></div></div>}
            {stale.length>0&&<div onClick={function(){setModal({title:"Stale client follow-ups (over 14 days)",icon:"💬",color:"#D97706",tickets:stale});}} className="card" style={{padding:"11px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",borderColor:"var(--amber-border)",background:"var(--amber-bg)"}}>
              <span style={{fontSize:20}}>💬</span><div><div style={{color:"var(--amber)",fontWeight:800,fontSize:13.5}}>{stale.length} client follow-up{stale.length!==1?"s":""} going stale</div><div style={{color:"var(--t2)",fontSize:11.5,marginTop:1}}>Waiting on the client over 14 days — worth a nudge.</div></div></div>}

      <CategoryDetailModal data={catModal} activeTab={catTab} onTabChange={setCatTab} onClose={closeCatModal} onReport={openEnggReport} onMail={openEnggMail} onClientReport={handleClientReport} onClientMail={handleClientMail} onRemind={function(t,mode){setReminderData({ticket:t,mode:mode||"internal"});}}/>
      <MailDraftModal data={mailModal} onClose={function(){setMailModal(null);}}/>
      <ReminderModal ticket={reminderData?reminderData.ticket:null} mode={reminderData?reminderData.mode:"internal"} onClose={function(){setReminderData(null);}}/>
      {/* ─── Global Ticket Search ─── */}
      <GlobalSearchModal open={globalSearchOpen} onClose={function(){setGlobalSearchOpen(false);}} tickets={raw}
        onRemind={function(t,mode){setGlobalSearchOpen(false);setReminderData({ticket:t,mode:mode||"internal"});}}
        onMailDraft={function(t){setGlobalSearchOpen(false);setMailModal(buildSingleTicketMailDraft(t));}}/>
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
