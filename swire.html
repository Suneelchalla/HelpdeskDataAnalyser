<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swire Hypercare</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E2A47'/%3E%3Cpath d='M6 20h20l-3 5H9z' fill='%2357C5CF'/%3E%3Cpath d='M15 7v12M15 8l7 9h-7' stroke='%23fff' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="hd-store.js"></script>
<script src="sla-engine.js"></script>
<script src="sla-history.js"></script>
<script src="sla-link.js"></script>
<script src="hd-hypercare.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2A47;--navy2:#163A5F;--navy3:#24507C;--teal:#0E7C86;--teal-bg:#E6F4F5;--sea:#57C5CF;
  --paper:#F4F7F9;--card:#FFFFFF;--ink:#0F1E2E;--ink2:#44546A;--muted:#6B7A8C;--faint:#9AA8B6;--line:#DFE6EC;--line2:#CBD5DF;
  --ss:#C8102E;--ss-bg:#FDECEF;--cr:#C2680A;--cr-bg:#FEF3E6;--hi:#A16207;--hi-bg:#FEF9E7;--md:#2563EB;--md-bg:#EEF4FF;--lo:#64748B;--lo-bg:#F1F5F9;
  --ok:#15803D;--ok-bg:#EAF7EF;--client:#B45309;
  --disp:'Space Grotesk',system-ui,sans-serif;--sans:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.hidden{display:none!important}
.mono{font-family:var(--mono);font-size:.92em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ── header: navy chrome + the 24-hour watch band ── */
.hdr{background:var(--navy);color:#E6EEF6;padding:14px 22px 0}
.hdr-top{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.brand h1{font-family:var(--disp);font-weight:700;font-size:1.55rem;letter-spacing:-.01em;color:#fff}
.brand p{color:#A9BED3;font-size:.86rem;margin-top:2px}
.hdr-side{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-d{background:var(--navy2);border:1px solid var(--navy3);color:#D6E3EF;border-radius:999px;padding:5px 11px;font-size:.8rem}
.chip-d b{color:#fff;font-weight:600}
.hbtn{background:var(--navy2);border:1px solid var(--navy3);color:#fff;border-radius:8px;padding:6px 12px;font-size:.82rem;font-weight:600}
.hbtn:hover{background:var(--navy3)}
.watch{margin-top:14px;display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:18px;align-items:end;padding-bottom:14px}
.watch-now .k{color:#A9BED3;font-size:.78rem}
.watch-now .v{font-family:var(--disp);font-size:1.25rem;font-weight:600;color:#fff;margin-top:1px}
.watch-now .s{font-size:.82rem;color:#C9D7E5;margin-top:4px;line-height:1.45}
.band{position:relative;height:56px}
.band-row{position:absolute;left:0;right:0;top:14px;height:26px;display:flex;border-radius:6px;overflow:hidden}
.seg{height:100%;display:flex;align-items:center;padding:0 8px;font-size:.74rem;color:#fff;white-space:nowrap;overflow:hidden;border-right:1px solid rgba(255,255,255,.15)}
.seg.night{background:#0A1F36;color:#9FC3E6}.seg.call{background:#7A4A12;color:#FCE3C2}.seg.day{background:var(--teal);color:#E3F7F8}.seg.weekend{background:#3B4E66;color:#DCE6F0}
.seg.cur{box-shadow:inset 0 0 0 2px var(--sea)}
.ticks{position:absolute;left:0;right:0;top:42px;height:12px;font-size:.68rem;color:#8EA7BF}
.ticks span{position:absolute;transform:translateX(-50%)}
.nowmark{position:absolute;top:6px;height:40px;width:2px;background:var(--sea);border-radius:2px}
.nowmark i{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--sea);color:var(--navy);font-style:normal;font-size:.68rem;font-weight:700;padding:0 5px;border-radius:4px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 18px;background:var(--navy2)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 13px;color:#B9CBDD;font-size:.86rem;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--sea);font-weight:600}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:rgba(255,255,255,.12);font-size:.74rem;text-align:center}
.tab .n.hot{background:var(--ss);color:#fff}

/* ── body ── */
.wrap{max-width:1500px;margin:0 auto;padding:18px 22px 60px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .lbl{font-size:.8rem;color:var(--muted);margin-right:2px}
.pill{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.8rem;color:var(--ink2)}
.pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.inp{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font:inherit;font-size:.85rem;background:var(--card);color:var(--ink)}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{filter:brightness(1.07);color:#fff}
h2{font-family:var(--disp);font-size:1.12rem;font-weight:600;margin:4px 0 4px}
.sub{color:var(--muted);font-size:.84rem;line-height:1.5;margin-bottom:12px;max-width:80ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}.watch{grid-template-columns:1fr}}

/* counters: a row of signals, each opens its list */
.signals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.sig{text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:8px;padding:10px 12px}
.sig:hover{border-color:var(--teal);border-left-color:inherit}
.sig .v{font-family:var(--disp);font-size:1.5rem;font-weight:700;line-height:1.1}
.sig .k{font-size:.8rem;color:var(--ink2);margin-top:2px}
.sig .h{font-size:.74rem;color:var(--muted);margin-top:2px}
.sig.ss{border-left-color:var(--ss)}.sig.ss .v{color:var(--ss)}
.sig.cr{border-left-color:var(--cr)}.sig.cr .v{color:var(--cr)}
.sig.teal{border-left-color:var(--teal)}
.sig.zero .v{color:var(--faint)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.76rem;padding:8px 10px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap;position:sticky;top:0}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
td{padding:8px 10px;border-bottom:1px solid #EEF2F5;vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#F7FAFB}
tr.row{cursor:pointer}
.key{font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--navy3);white-space:nowrap}
.sum{min-width:200px;max-width:40ch;color:var(--ink)}
.dim{color:var(--muted)}.small{font-size:.78rem}
.pr{display:inline-block;border-radius:5px;padding:1px 7px;font-size:.74rem;font-weight:600;white-space:nowrap}
.pr.showstopper{background:var(--ss);color:#fff}.pr.critical{background:var(--cr-bg);color:var(--cr)}.pr.high{background:var(--hi-bg);color:var(--hi)}
.pr.medium{background:var(--md-bg);color:var(--md)}.pr.low{background:var(--lo-bg);color:var(--lo)}.pr.none{background:var(--lo-bg);color:var(--muted)}
.st{display:inline-block;border-radius:5px;padding:1px 7px;font-size:.74rem;background:var(--lo-bg);color:var(--ink2);white-space:nowrap}
.st.openbox{background:#EEF2FF;color:#4338CA}.st.client{background:#FEF3E6;color:var(--client)}.st.working{background:var(--teal-bg);color:var(--teal)}.st.closed{background:var(--ok-bg);color:var(--ok)}
.clk{white-space:nowrap;font-variant-numeric:tabular-nums}
.clk.bad{color:var(--ss);font-weight:600}.clk.warn{color:var(--cr);font-weight:600}.clk.good{color:var(--ok)}
.who{white-space:nowrap}.who .r{color:var(--muted);font-size:.72rem;display:block}
.tel{font-size:.76rem;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{background:#F7FAFB;border:1px dashed var(--line2);border-radius:8px;padding:9px 12px;font-size:.8rem;color:var(--ink2);line-height:1.5;margin-bottom:12px}
.warnbox{background:var(--cr-bg);border:1px solid #F5CF9F;color:#7A4A12;border-radius:8px;padding:9px 12px;font-size:.82rem;margin-bottom:12px;line-height:1.5}

/* rule checks */
.chk{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid #EEF2F5;cursor:pointer}
.chk:last-child{border-bottom:none}
.chk:hover{background:#F7FAFB}
.chk .ref{font-family:var(--mono);font-size:.76rem;color:var(--navy3);font-weight:600}
.chk .t{font-weight:600}
.chk .w{font-size:.78rem;color:var(--muted);margin-top:2px}
.chk .c{font-family:var(--disp);font-size:1.3rem;font-weight:700;min-width:48px;text-align:right}
.chk .c.ok{color:var(--ok)}.chk .c.bad{color:var(--ss)}

/* charts */
.bars{display:flex;align-items:stretch;gap:2px;height:150px;padding-top:8px}
.bars .b{flex:1;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:3px;position:relative}
.bars .b i{display:block;border-radius:2px 2px 0 0}
.bars .b i.c{background:var(--navy3)}.bars .b i.x{background:var(--sea)}
.axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 44px;gap:8px;align-items:center;font-size:.82rem;margin:5px 0}
.hb .tr{background:#EEF2F5;border-radius:4px;height:12px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--teal);border-radius:4px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb.wide{grid-template-columns:minmax(150px,280px) 1fr 44px}
.pct{font-family:var(--disp);font-weight:700}
.exit li{list-style:none;padding:6px 0;border-bottom:1px solid #EEF2F5;display:flex;gap:10px;font-size:.84rem}
.exit li:last-child{border-bottom:none}
.exit .m{width:18px;text-align:center;font-weight:700}
.exit .m.ok{color:var(--ok)}.exit .m.no{color:var(--ss)}.exit .m.na{color:var(--faint)}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(14,42,71,.35);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--card);width:min(640px,100%);height:100%;overflow-y:auto;padding:20px 22px 40px;box-shadow:-12px 0 40px rgba(14,42,71,.2)}
.drawer h3{font-family:var(--disp);font-size:1.15rem;margin:6px 0 10px;line-height:1.35}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:.84rem;margin:10px 0 16px}
.kv dt{color:var(--muted)}.kv dd{color:var(--ink)}
.sec-h{font-weight:600;font-size:.86rem;margin:14px 0 6px;color:var(--navy)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl div{font-size:.8rem;margin:5px 0;position:relative}
.tl div:before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--line2)}
.pre{white-space:pre-wrap;font-size:.82rem;line-height:1.5;color:var(--ink2);background:#F7FAFB;border-radius:8px;padding:10px 12px;max-height:240px;overflow:auto}
.report{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 26px}
.report h3{font-family:var(--disp);font-size:1.05rem;margin:16px 0 6px;color:var(--navy)}
.report h3:first-child{margin-top:0}
textarea.ho{width:100%;min-height:420px;font-family:var(--mono);font-size:.8rem;line-height:1.55;border:1px solid var(--line2);border-radius:10px;padding:14px;color:var(--ink)}
.setrow{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center;margin:8px 0;font-size:.85rem}
.landing{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
.landing h2{font-size:1.4rem}
.prog{height:4px;background:#E3EAF0;border-radius:4px;overflow:hidden;width:180px;display:inline-block;vertical-align:middle;margin-left:8px}
.prog i{display:block;height:100%;background:var(--teal);width:0}

@media print{
  .hdr,.bar,.noprint{display:none!important}
  body{background:#fff}.wrap{padding:0}
  .report{border:none;padding:0}
  .panel,.tw{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <div class="brand">
      <h1>Swire Shipping Hypercare</h1>
      <p id="brandSub">Phoenix support, run to the Hypercare runbook</p>
    </div>
    <div class="hdr-side">
      <span class="chip-d" id="phaseChip">Loading…</span>
      <span class="chip-d" id="histChip" title="Status history drives first response and progress"></span>
      <span class="chip-d" id="lrpsChip"></span>
      <button class="hbtn" id="btnLrps" title="Read the assignee of every linked LRPS ticket from Jira">Refresh LRPS assignees</button>
      <a class="hbtn" href="index.html" style="text-decoration:none">Launcher</a>
    </div>
  </div>
  <div class="watch">
    <div class="watch-now">
      <div class="k" id="watchDay">Now</div>
      <div class="v" id="watchWho">—</div>
      <div class="s" id="watchSub"></div>
    </div>
    <div class="band" id="band" aria-label="Today's duty windows"></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<main class="wrap">
  <div id="landing" class="landing"><div><h2>Loading Swire tickets…</h2><p class="sub" style="margin:8px auto 0">Load a Jira export or fetch from Jira on the launcher first.</p></div></div>
  <div id="view" class="hidden"></div>
</main>

<script>
(function () {
"use strict";
const HC = window.HDHypercare, HS = window.HDStore, L = window.HDSlaLink;
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = HC.fmtMin, MIN = 60000, DAY = 86400000;
const CFG_KEY = "hd-swire-cfg", LRPS_KEY = "hd-swire-lrps";

/* ── state ── */
let CFG = loadCfg(), ROWS = [], T = [], E = [], NOW = Date.now(), TAB = "now", TYPES = null, ALLTYPES = [], LRPS = loadLrps();
const UI = { range: "start", from: "", to: "", q: "", stage: "", sev: "", po: "", sort: { k: "age", d: -1 }, openCheck: null, week: null, shift: "" };

function loadCfg() { try { return HC.merge(JSON.parse(localStorage.getItem(CFG_KEY) || "null")); } catch (e) { return HC.merge(null); } }
function saveCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {} CFG = HC.merge(c); }
function loadLrps() { try { return JSON.parse(localStorage.getItem(LRPS_KEY) || "{}") || {}; } catch (e) { return {}; } }
function saveLrps() { try { localStorage.setItem(LRPS_KEY, JSON.stringify(LRPS)); } catch (e) {} }
function jiraHost() { try { const c = JSON.parse(localStorage.getItem("hd-jira-cfg") || "{}"); if (c.jiraHost) return c.jiraHost; } catch (e) {} return "svmhelpdesk.atlassian.net"; }
const jiraUrl = (k) => "https://" + jiraHost() + "/browse/" + encodeURIComponent(k);

/* ── formatting ── */
function fdt(ms) { if (ms == null) return "—"; const d = new Date(ms + 330 * MIN); const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return String(d.getUTCDate()).padStart(2, "0") + " " + M[d.getUTCMonth()] + " " + String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); }
function fday(ms) { if (ms == null) return "—"; const d = new Date(ms + 330 * MIN); const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return d.getUTCDate() + " " + M[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
function hhmm(min) { return String(Math.floor(min / 60) % 24).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0"); }
const prChip = (t) => '<span class="pr ' + (t.sev || "none") + '">' + esc(t.priority || "—") + "</span>";
const STAGE_TXT = { openbox: "Open box", working: "With us", client: "With Swire", closed: "Closed" };
const stChip = (t, e) => '<span class="st ' + e.stage + '" title="' + esc(STAGE_TXT[e.stage]) + '">' + esc(t.status || "—") + "</span>";
function ageOf(t) { return t.created != null ? (NOW - t.created) / MIN : null; }

/* ── data ── */
function pickSheet(wb) { return wb.SheetNames.find((s) => s.toLowerCase().indexOf("jira issues") > -1) || wb.SheetNames.find((s) => s.toLowerCase().indexOf("issue") > -1) || wb.SheetNames[1] || wb.SheetNames[0]; }
function getRows() {
  if (!HS) return Promise.resolve([]);
  return HS.loadRows().then((ed) => {
    if (ed && ed.length) return ed;
    return HS.loadFile().then((rec) => {
      if (!rec || !rec.blob) return [];
      return new Promise((res) => { const r = new FileReader(); r.onload = (e) => { try { const wb = XLSX.read(e.target.result, { type: "array", cellDates: true }); res(XLSX.utils.sheet_to_json(wb.Sheets[pickSheet(wb)], { defval: "" })); } catch (x) { res([]); } }; r.readAsArrayBuffer(rec.blob); });
    });
  });
}
const CLS = { isTerminal: (s) => window.HDClass ? HDClass.isTerminal(s) : /^closed$/i.test(String(s || "")), owner: (s) => window.HDClass ? HDClass.owner(s) : null };

function rebuild() {
  NOW = Date.now();
  const get = HC.getter(ROWS), pre = String(CFG.prefix || "SWIPHX").toUpperCase();
  const all = [];
  ROWS.forEach((row) => { const t = HC.normTicket(row, get); if (t.prefix === pre) { t.nextAction = String(get(row, "next action") || "").trim(); all.push(t); } });
  ALLTYPES = Array.from(new Set(all.map((t) => t.type || "(blank)"))).sort();
  if (!TYPES) TYPES = ALLTYPES.filter((x) => /^(incident|service request)$/i.test(x));
  if (!TYPES.length) TYPES = ALLTYPES.slice();
  T = all.filter((t) => TYPES.indexOf(t.type || "(blank)") > -1);
  E = T.map((t) => {
    let tr = null;
    if (L && L.ready()) { const d = L.detail(t._row); if (d && d.entry) tr = d.entry.transitions; }
    const e = HC.evaluate(t, tr, NOW, CFG, CLS, window.HDSla ? HDSla.firstResponse : null);
    e.po = HC.poFor(t, CFG);
    return e;
  });
}

/* ── the HD Jira Bridge (direct, or through the launcher when opened as a tab) ── */
const BR = { ready: false, own: false, par: false, seq: 8000000, pend: {} };
let PARENT = null; try { if (window.parent && window.parent !== window) PARENT = window.parent; } catch (e) {}
window.addEventListener("message", (e) => {
  const d = e.data; if (!d) return;
  if (d.type === "HD_BRIDGE_READY") { if (e.source === window || !d.relay) BR.own = true; else if (PARENT && e.source === PARENT) BR.par = true; else return; BR.ready = true; return; }
  if (d.type === "HD_RELAY_READY") { if (PARENT && e.source === PARENT) { BR.par = true; BR.ready = true; } return; }
  if (d.type !== "HD_BRIDGE_RESULT" && !(d.type === "HD_RELAY_RESULT" && PARENT && e.source === PARENT)) return;
  const p = BR.pend[d.id]; if (!p) return; delete BR.pend[d.id];
  if (d.ok) p.res(d.data); else p.rej(new Error(d.error || "Bridge error"));
});
function ping() { if (BR.ready) return; window.postMessage({ type: "HD_BRIDGE_PING" }, "*"); if (PARENT) try { PARENT.postMessage({ type: "HD_RELAY_PING" }, location.origin); } catch (e) {} }
[0, 300, 1000, 3000].forEach((ms) => setTimeout(ping, ms));
function call(path) {
  if (!BR.ready && !window._rmBridge) return Promise.reject(new Error("The HD Jira Bridge extension is not connected."));
  return new Promise((res, rej) => {
    const id = ++BR.seq; BR.pend[id] = { res, rej };
    const msg = { type: "HD_BRIDGE_CALL", id, host: jiraHost(), path, method: "GET", body: null };
    if (BR.own || window._rmBridge || !BR.par || !PARENT) window.postMessage(msg, "*"); else { msg.type = "HD_RELAY_CALL"; PARENT.postMessage(msg, location.origin); }
    setTimeout(() => { if (BR.pend[id]) { delete BR.pend[id]; rej(new Error("Jira did not answer in time.")); } }, 60000);
  });
}

/* ── LRPS assignees: read from Jira for the engineering tickets linked to open Swire tickets ── */
let lrpsBusy = false;
function lrpsKeys(onlyStale) {
  const keys = new Set();
  T.forEach((t, i) => { if (E[i].stage !== "closed") t.lrps.forEach((k) => keys.add(k)); });
  return Array.from(keys).filter((k) => !onlyStale || !LRPS[k] || NOW - (LRPS[k].at || 0) > 30 * MIN);
}
function fetchLrps(force) {
  if (lrpsBusy) return Promise.resolve();
  const keys = lrpsKeys(!force); if (!keys.length) { paintChips(); return Promise.resolve(); }
  lrpsBusy = true; paintChips("Reading " + keys.length + " LRPS tickets…");
  const chunks = []; for (let i = 0; i < keys.length; i += 80) chunks.push(keys.slice(i, i + 80));
  let done = 0;
  const one = (ch) => {
    const jql = "key in (" + ch.map((k) => '"' + k + '"').join(",") + ")";
    return call("/rest/api/3/search/jql?jql=" + encodeURIComponent(jql) + "&fields=assignee,status,updated&maxResults=100").then((d) => {
      const seen = {}, at = Date.now();
      (d.issues || []).forEach((is) => { const f = is.fields || {}; seen[is.key] = 1;
        LRPS[is.key] = { a: f.assignee ? (f.assignee.displayName || f.assignee.emailAddress || "") : "", s: f.status ? f.status.name : "", at }; });
      ch.forEach((k) => { if (!seen[k]) LRPS[k] = { a: "", s: "", at, gone: true }; });
      done += ch.length; paintChips("Reading LRPS tickets " + done + " / " + keys.length + "…");
    });
  };
  return chunks.reduce((p, ch) => p.then(() => one(ch)), Promise.resolve())
    .then(() => { saveLrps(); lrpsBusy = false; paintChips(); render(); })
    .catch((e) => { saveLrps(); lrpsBusy = false; paintChips("LRPS: " + e.message); render(); });
}

/* team shifts (Setup): 1st 06:00–15:00, 2nd 12:30–21:30, Night 21:00–06:00. They overlap, so a ticket created in an
   overlap belongs to both shifts. UI.shift is "id|start" of the chosen shift; by default the shift running now
   (in an overlap, the one that ends first, since it is the one handing over). */

  return HC.shiftInstances(CFG, NOW - 2 * DAY, NOW).filter((x) => x.start <= NOW).slice(-6);
}
function currentShiftKey() {
  const live = recentShifts().filter((x) => x.end > NOW).sort((a, b) => a.end - b.end);
  const x = live[0] || recentShifts().slice(-1)[0]; return x ? x.id + "|" + x.start : "";
}
function shiftWindow(key) {
  const list = recentShifts(); let x = list.find((s) => s.id + "|" + s.start === key);
  if (!x) { const ck = currentShiftKey(); x = list.find((s) => s.id + "|" + s.start === ck); }
  if (!x) return { start: NOW - 9 * 3600e3, end: NOW, planEnd: NOW, label: "Shift", live: true, key: "" };
  const live = x.end > NOW, d = HC.ist(x.start), M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return { start: x.start, end: Math.min(x.end, NOW), planEnd: x.end, live, key: x.id + "|" + x.start,
    label: x.name + " (" + x.from + "–" + x.to + "), " + d.d + " " + M[d.mo] };
}
function overlapNote() {
  const sh = CFG.shifts || [], parts = [];
  for (let i = 0; i < sh.length; i++) { const a = sh[i], b = sh[(i + 1) % sh.length];
    const toM = (t) => { const m = String(t).match(/(\d+):(\d+)/); return m ? +m[1] * 60 + +m[2] : 0; };
    const aEnd = toM(a.to) <= toM(a.from) ? toM(a.to) + 1440 : toM(a.to), bStart = toM(b.from) < toM(a.from) ? toM(b.from) + 1440 : toM(b.from);

  const V = { now: viewNow, openbox: viewOpenBox, esc: viewEsc, rules: viewRules, queue: viewQueue, analytics: viewAnalytics, handover: viewHandover, weekly: viewWeekly, setup: viewSetup }[TAB] || viewNow;

}
function wire() {

  on("hoFrom", "input", (e) => { const p = hoPeople(); p.from = e.target.value; hoSavePeople(p); hoRefresh(); });
  on("hoTo", "input", (e) => { const p = hoPeople(); p.to = e.target.value; hoSavePeople(p); hoRefresh(); });
  on("hoNote", "input", (e) => { UI.hoNote = e.target.value; hoRefresh(); });
  on("hoCopy", "click", (e) => {
    const d = hoData(UI.shift), ppl = Object.assign(hoPeople(), { note: UI.hoNote || "" }), html = mailHTML(d, ppl), text = mailText(d, ppl), b = e.target;
    const done = (msg) => { b.textContent = msg; setTimeout(() => { b.textContent = "Copy email"; }, 1800); };
    const fallback = () => {           /* select the rendered mail and copy it: keeps the tables when pasted into Outlook */
      const box = document.createElement("div"); box.style.cssText = "position:fixed;left:-9999px;top:0;background:#fff"; box.innerHTML = html; document.body.appendChild(box);
      const r = document.createRange(); r.selectNodeContents(box); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      let ok = false; try { ok = document.execCommand("copy"); } catch (x) {} sel.removeAllRanges(); box.remove(); done(ok ? "Copied, paste into Outlook" : "Copy blocked by the browser");
    };
    if (navigator.clipboard && window.ClipboardItem) navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([text], { type: "text/plain" }) })]).then(() => done("Copied, paste into Outlook"), fallback);
    else fallback();
  });
  on("hoEml", "click", () => {

    const body = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + mailHTML(d, ppl) + "</body></html>";
    const eml = ["X-Unsent: 1", "Subject: =?UTF-8?B?" + b64(hoSubject(d)) + "?=", "MIME-Version: 1.0", "Content-Type: text/html; charset=UTF-8", "Content-Transfer-Encoding: base64", "", b64(body).replace(/.{76}/g, "$&\r\n")].join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([eml], { type: "message/rfc822" }));

  });
  on("hoPrint", "click", () => { const d = hoData(UI.shift); const name = "Swire Hypercare handover " + HC.dayKey(d.w.start) + " " + d.w.key.split("|")[0] + " shift"; window.HDPrint ? HDPrint(name) : window.print(); });

    c.start = el("sStart").value || c.start; c.openBox = el("sBox").value.split(",").map((s) => s.trim()).filter(Boolean);
    c.triageMin = Math.max(1, parseInt(el("sTri").value, 10) || c.triageMin); c.prefix = el("sPre").value.trim().toUpperCase() || c.prefix;
    document.querySelectorAll("[data-tg]").forEach((x) => { const [s, k] = x.dataset.tg.split("."); const v = parseFloat(x.value); if (v > 0) c.targets[s][k] = v; });
    document.querySelectorAll("[data-shf]").forEach((x) => { const [k, f] = x.dataset.shf.split("."); if (/^\d{1,2}:\d{2}$/.test(x.value.trim())) c.shifts[+k][f] = x.value.trim().padStart(5, "0"); });
    document.querySelectorAll("[data-mod]").forEach((x) => { const [k, f] = x.dataset.mod.split("."); c.modules[+k][f] = f === "match" ? x.value.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean) : x.value.trim(); });
    TYPES = Array.from(document.querySelectorAll("[data-type]")).filter((x) => x.checked).map((x) => x.dataset.type);
    saveCfg(c); el("sSave").textContent = "Saved"; setTimeout(render, 600);
  });
  on("sReset", "click", () => { if (confirm("Restore every setting to the runbook defaults?")) { try { localStorage.removeItem(CFG_KEY); } catch (e) {} CFG = HC.merge(null); TYPES = null; render(); } });
}
el("btnLrps").addEventListener("click", () => fetchLrps(true));

/* ── boot ── */
function autoHistory() {
  /* status history: open tickets and everything since counting started (the rest on request in Analytics) */
  if (!L || !L.autoFetch) return;
  const from = HC.dateMs(CFG.start);
  L.autoFetch(T.filter((t, i) => E[i].stage !== "closed" || (t.created != null && t.created >= from)).map((t) => t._row));
}
Promise.resolve(HS && HS.loadConfig ? HS.loadConfig().then((c) => { if (window.HDClass && c) HDClass.setOverrides(c.statusOverrides); }).catch(() => {}) : null)
  .then(() => Promise.all([getRows(), L ? Promise.resolve(L.load()).catch(() => {}) : null]))
  .then(([rows]) => {
    ROWS = rows || [];
    if (!ROWS.length) { el("landing").innerHTML = '<div><h2>No data loaded</h2><p class="sub" style="margin:8px auto 14px">Load a Jira export or fetch from Jira on the launcher, then come back here.</p><a class="btn pri" href="index.html" style="text-decoration:none">Open the launcher</a></div>'; return; }
    rebuild();
    if (!T.length) { el("landing").innerHTML = '<div><h2>No ' + esc(CFG.prefix) + ' tickets in this data</h2><p class="sub" style="margin:8px auto 0">The loaded data has no tickets whose key starts with ' + esc(CFG.prefix) + '. Check the Jira query on the launcher.</p></div>'; return; }
    el("landing").classList.add("hidden"); el("view").classList.remove("hidden");
    render();
    if (L) { let pend = null; L.subscribe(() => { clearTimeout(pend); pend = setTimeout(render, 400); }); if (L.onProgress) L.onProgress(() => paintChips()); }
    autoHistory();
    setTimeout(() => { if (BR.ready || window._rmBridge) fetchLrps(false); }, 3500);
    setInterval(() => { if (!document.hidden && !document.querySelector(".ov") && TAB !== "handover" && TAB !== "setup") render(); else paintDuty(); }, 60000);
  })
  .catch((e) => { el("landing").innerHTML = '<div><h2>Could not load the data</h2><p class="sub">' + esc(e.message || e) + "</p></div>"; });
})();
</script>
