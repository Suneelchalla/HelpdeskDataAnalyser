    peers.map(function(x){ return '<span class="peer">'+esc(x.name)+'<button data-unpeer="'+esc(x.name)+'" aria-label="Remove '+esc(x.name)+'">✕</button></span>'; }).join("")+
    (peers.length<4?'<select id="paddpeer"><option value="">+ add a person…</option>'+others.map(function(x){return '<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>';}).join("")+'</select>':'')+
    (others.length&&!peers.length?'<button class="btn" id="pbestpeer">Add the best on “'+esc(ks.filter(function(k){return k.b>0;})[0].l)+'”</button>':'')+'</div>'+
    '<div class="ttable-wrap"><table class="ptab cmp"><thead><tr><th>Measure</th><th class="num me">'+esc(who)+'</th><th class="num" title="The middle value of the team">Team typical</th><th class="num">Best in team</th>'+peers.map(function(x){return '<th class="num">'+esc(x.name)+'</th>';}).join("")+'<th style="min-width:180px">Where '+esc(who.split(" ")[0])+' stands <span style="font-weight:500;text-transform:none">(right = better)</span></th></tr></thead><tbody>'+
    ks.map(function(k){
      var s=st[k.id], v=k.g(m);
      function cell(x){ var vv=k.g(x); return vv==null||isNaN(vv)?'<span class="pfaint">—</span>':'<span class="pnum" data-dr="'+dr(x.name+" — "+k.l,k.L(x))+'">'+k.f(vv)+'</span>'; }
      return '<tr><td class="pname" title="'+esc(k.tip)+'">'+esc(k.l)+(k.b===0?' <span class="pfaint" title="Context only — not better or worse">ⓘ</span>':'')+'</td><td class="num me">'+cell(m)+'</td><td class="num">'+(s&&s.med!=null?k.f(s.med):"—")+'</td>'+
        '<td class="num">'+(s&&s.best?'<span class="pnum" data-person="'+esc(s.best.m.name)+'" title="Open '+esc(s.best.m.name)+'’s report">'+k.f(s.best.v)+' <span class="pfaint">'+esc(s.best.m.name)+'</span></span>':'—')+'</td>'+
        peers.map(function(x){return '<td class="num">'+cell(x)+'</td>';}).join("")+'<td>'+(k.b?spread(k,st,m):'<span class="pfaint">context</span>')+'</td></tr>';
    }).join("")+'</tbody></table></div>';
  /* strengths & focus areas */
  var good=[], focus=[];
  if(ranked) ks.forEach(function(k){ if(!k.b) return; var s=st[k.id], v=k.g(m), tn=toneOf(k,s,v), q=tn==="good"?1:tn==="bad"?0:null; if(q==null) return; if(q>=0.75) good.push(k.l+' <b>'+k.f(v)+'</b> (team typical '+k.f(s.med)+')'); else if(q<=0.25) focus.push(k.l+' <b>'+k.f(v)+'</b> (team typical '+k.f(s.med)+')'); });
  var obs='<div class="grid2">'+
    '<div class="chartcard"><div class="ct">✅ Strengths <span class="pfaint">· clearly better than the team</span></div>'+(good.length?'<ul class="plist">'+good.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>':'<div class="empty">'+(ranked?"Nothing clearly ahead of the team this period.":"Not enough tickets to rank.")+'</div>')+'</div>'+
    '<div class="chartcard"><div class="ct">🎯 Focus areas <span class="pfaint">· clearly behind the team</span></div>'+(focus.length?'<ul class="plist">'+focus.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>':'<div class="empty">'+(ranked?"Nothing clearly behind the team this period. 👍":"Not enough tickets to rank.")+'</div>')+'</div></div>';
  /* month by month (12 months to the period end), with the team median for each month */
  var mon=monthly(view,m,pc);

  /* activity & speed */
  var act='<div class="sectitle">Activity &amp; speed <span class="sub">click a bar or number for its tickets</span></div><div class="grid2">'+
    '<div class="chartcard"><div class="ct">New vs closed per week <span class="pfaint">· last 12 weeks to '+fdate(pc.r.to)+'</span></div>'+weekChart(ws,who)+'</div>'+
    '<div class="chartcard"><div class="ct">How long tickets took <span class="pfaint">· closed in the period, created → resolved</span></div>'+resBuckets(m.closedL,who)+
      '<div class="pfaint" style="margin-top:6px">Typical '+fmtD(m.resMed)+' · 9 in 10 within '+fmtD(m.resP90)+' · Help Desk fixes typically '+fmtD(m.hdResMed)+(view==="svm"?' · Engineering fixes typically '+fmtD(m.enggResMed):'')+'</div>'+
      (view==="hd"?'<div class="pfaint" style="margin-top:4px">First response: typically <b>'+fmtH(m.frMed)+'</b> · 9 in 10 within '+fmtH(m.frP90)+' · '+num(m.frSlow.length,who+" — first response over 4 hours",m.frSlow,"bad")+' over 4 hours · '+num(m.frNone.length,who+" — new, nothing sent to the client yet",m.frNone)+' not answered yet'+(m.frOther?' · '+m.frOther+' closed without a client status (marked *)':'')+'</div>':'')+'</div></div>';
  /* outcome split */
  var hdN=m.hdL.length, egN=m.enggL.length, tot=Math.max(1,hdN+egN);
  var split='<div class="chartcard" style="margin-top:11px"><div class="ct">Closed in the period: who resolved it</div>'+
    '<div class="psplit"><i style="width:'+(hdN/tot*100)+'%;background:#0F766E" data-dr="'+dr(who+" — solved by HD",m.hdL)+'">'+(hdN?hdN+" HD":"")+'</i><i style="width:'+(egN/tot*100)+'%;background:#5B57D8" data-dr="'+dr(who+" — needed Engineering",m.enggL)+'">'+(egN?egN+" Engg":"")+'</i></div>'+
    '<div class="pfaint" style="margin-top:6px">'+num(m.crit.length,who+" — Critical / High closed",m.crit)+' Critical / High / Show Stopper closed · '+num(m.slaBreach.length,who+" — open and SLA breached",m.slaBreach,"bad")+' open tickets past SLA · '+num(m.slaRisk.length,who+" — open and at SLA risk",m.slaRisk)+' at risk</div></div>';
  /* mix */
  var mix='<div class="sectitle">Where the work came from <span class="sub">closed in the period</span></div><div class="grid3">'+
    mixTable("By client",m.closedL,function(t){return t.client;},who,true)+
    mixTable("By component",m.closedL,function(t){return t.componentsRaw;},who,true)+
    mixTable("By root cause",m.closedL,function(t){return t.rootCause;},who,false)+'</div>'+
    (view==="svm"?'<div class="grid3" style="margin-top:11px">'+mixTable("Type of fix",m.enggL,function(t){return t.typeOfFix;},who,false)+mixTable("Open with Engineering by status",m.openEngg,function(t){return t.status;},who,false)+mixTable("HD worker on these tickets",m.closedL,function(t){return t.currentWorker;},who,true)+'</div>'
                  :'<div class="grid3" style="margin-top:11px">'+mixTable("By priority",m.closedL,function(t){return t.priority;},who,true)+mixTable("By request type",m.closedL,function(t){return t.issueType;},who,true)+mixTable("SVM in-charge of these tickets",m.closedL,function(t){return t.svmInCharge;},who,true)+'</div>');
  /* open work */
  var openList=(view==="svm"?m.openEngg.concat(m.openSvm.filter(function(t){return m.openEngg.indexOf(t)<0;})):m.openSvm);
  var open='<div class="sectitle">Open work now <span class="sub">'+num(m.openSvm.length,who+" — open with us",m.openSvm)+' with us · '+num(m.openClient.length,who+" — waiting on the client",m.openClient)+' with the client'+(view==="svm"?' · '+num(m.openEngg.length,who+" — with Engineering",m.openEngg)+' with Engineering':'')+' · '+num(m.stale.length,who+" — stale",m.stale,"bad")+' stale · oldest first</span></div>'+
    (openList.length?ticketTable(openList.slice(0,40),["key","summary","status","stage","priority","component",view==="hd"?"svm":"worker","age"]):'<div class="empty">Nothing open on our side. 🎉</div>')+
    (openList.length>40?'<div class="pfaint" style="margin-top:6px">Showing the 40 oldest of '+num(openList.length,who+" — open",openList)+'.</div>':'');
  return head+'<div class="rbody">'+cards+cmp+obs+mon+act+split+mix+open+notes(view)+'</div>';
}

var MON_KPI={ hd:["intake","closed","frMed","hdPct","hdResMed","slaPct","cbPct","docPct"], svm:["intake","closed","keptPct","enggResMed","released","slaPct","cbPct","rcPct"] };
function monthly(view,m,pc){
  var end=pc.r.to, months=[];
  for(var i=11;i>=0;i--){ var a=new Date(end.getFullYear(),end.getMonth()-i,1), b=new Date(end.getFullYear(),end.getMonth()-i+1,0,23,59,59,999); months.push({from:a,to:b,label:a.toLocaleDateString("en-GB",{month:"short",year:"2-digit"})}); }
  var ks=MON_KPI[view].map(function(id){ return KPI[view].filter(function(k){return k.id===id;})[0]; });
  var team=pc.team.filter(function(x){return x.name!==m.name;}).concat(pc.team.indexOf(m)>-1?[m]:[]);
  var rows=months.map(function(mo){
    var mine=metrics(m.all,mo,view), meds={};
    var tm=team.map(function(x){ return metrics(x.all,mo,view); });
    ks.forEach(function(k){ meds[k.id]=median(tm.map(function(z){return k.g(z);}).filter(function(v){return v!=null&&!isNaN(v);})); });
    return {mo:mo, m:mine, med:meds};
  });
  /* drop leading months with nothing at all */
  while(rows.length>1 && !rows[0].m.intake.length && !rows[0].m.closedL.length) rows.shift();
  function cell(k,row,prev){
    var v=k.g(row.m), med=row.med[k.id];
    if(v==null||isNaN(v)) return '<td class="num"><span class="pfaint">—</span></td>';
    var tone="", arrow="";
    if(k.b&&med!=null&&clearGap(k,v,med)){ var better=k.b>0? v>med : v<med; tone=better?"good":"bad"; }
    if(prev){ var pv=k.g(prev.m); if(pv!=null&&!isNaN(pv)&&Math.abs(v-pv)>=(k.f===fmtP?1:k.f===fmtH?60000:k.f===fmtD?0.05:0.5)){ var up=v>pv, good=k.b>0?up:k.b<0?!up:null; arrow=' <span class="marr '+(good==null?"":good?"g":"r")+'" title="vs previous month '+esc(k.f(pv))+'">'+(up?"▲":"▼")+'</span>'; } }
    var shown='<span class="pnum" data-dr="'+dr(m.name+" — "+k.l+" — "+row.mo.label,k.L(row.m))+'">'+k.f(v)+'</span>';
    return '<td class="num '+tone+'" title="Team typical that month: '+esc(med==null?"—":k.f(med))+'">'+shown+arrow+'<div class="mmed">'+(med==null?"":k.f(med))+'</div></td>';
  }
  /* chart: closed per month (bars) vs team median closed (line) */
  var W=640,H=150,L=28,B=22,T=10,n=rows.length,slot=(W-L-8)/Math.max(1,n),bw=Math.min(26,slot*0.55),mx=1,sv="";
  var ck=KPI[view].filter(function(k){return k.id==="closed";})[0];
  rows.forEach(function(r){ mx=Math.max(mx,r.m.closedL.length,r.med.closed||0); });
  var step=mx<=5?1:mx<=10?2:mx<=25?5:mx<=60?10:mx<=150?25:50, top=Math.ceil(mx/step)*step, pts=[];
  for(var g=0;g<=top;g+=step){ var y=T+(H-T-B)*(1-g/top); sv+='<line x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#E3E8EE"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="#9AA7B8">'+g+'</text>'; }
  rows.forEach(function(r,i){ var x=L+i*slot+(slot-bw)/2, h=(H-T-B)*r.m.closedL.length/top;
    if(r.m.closedL.length) sv+='<rect class="pbar" x="'+x+'" y="'+(H-B-h)+'" width="'+bw+'" height="'+h+'" rx="3" fill="#0F766E" data-dr="'+dr(m.name+" — closed in "+r.mo.label,r.m.closedL)+'"><title>'+r.mo.label+': '+r.m.closedL.length+' closed (team typical '+(r.med.closed==null?"—":r.med.closed)+')</title></rect>';
    if(r.med.closed!=null) pts.push((x+bw/2).toFixed(1)+","+(T+(H-T-B)*(1-r.med.closed/top)).toFixed(1));
    sv+='<text x="'+(L+i*slot+slot/2)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9" fill="#6B7A90">'+r.mo.label+'</text>'; });
  if(pts.length>1) sv+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="#B45309" stroke-width="1.6" stroke-dasharray="4 3"/>';
  pts.forEach(function(p){ var xy=p.split(","); sv+='<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="2.6" fill="#fff" stroke="#B45309" stroke-width="1.5"/>'; });
  /* best and weakest month on the first "better" measure after volume */
  return '<div class="sectitle">Month by month <span class="sub">last '+rows.length+' month'+(rows.length>1?"s":"")+' to '+fdate(end)+' · grey figure = team typical that month · green / red = clearly better / worse than the team · ▲▼ = up / down from last month</span></div>'+
    '<div class="chartcard"><div class="ct">Closed per month <span class="pfaint">· bars = '+esc(m.name)+' · dashed line = team typical</span></div><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Closed per month">'+sv+'</svg></div>'+
    '<div class="ttable-wrap" style="margin-top:10px"><table class="ptab mon"><thead><tr><th>Month</th>'+ks.map(function(k){return '<th class="num" title="'+esc(k.tip)+'">'+esc(k.l)+'</th>';}).join("")+'</tr></thead><tbody>'+
    rows.slice().reverse().map(function(r,i,arr){ var prev=arr[i+1]; return '<tr><td class="pname">'+r.mo.label+(r.mo.to>new Date()?' <span class="pfaint">so far</span>':'')+'</td>'+ks.map(function(k){return cell(k,r,prev);}).join("")+'</tr>'; }).join("")+
    '</tbody></table></div>';
}
function bindPerf(view,pc){
  document.querySelectorAll(".rtab").forEach(function(b){ b.onclick=function(){ P.view=b.getAttribute("data-view"); setHash(); render(); window.scrollTo(0,0); }; });
  var bb=el("backbtn2"); if(bb) bb.onclick=function(){ window.location.href="index.html"; };
  var ps=el("persel"); if(ps) ps.onchange=function(){ P.per=ps.value; render(); };
  var pf=el("pfrom"), pt=el("pto"); if(pf) pf.onchange=function(){ P.from=pf.value; render(); }; if(pt) pt.onchange=function(){ P.to=pt.value; render(); };
  var pcl=el("pclient"); if(pcl) pcl.onchange=function(){ P.client=pcl.value; render(); };
  var pmn=el("pmin"); if(pmn) pmn.onchange=function(){ P.minN=+pmn.value; render(); };
  mselBind();
  var pq=el("pq"); if(pq) pq.oninput=function(){ clearTimeout(P._qt); P._qt=setTimeout(function(){ var pos=pq.selectionStart; P.q=pq.value; render(); var q2=el("pq"); if(q2){ q2.focus(); try{q2.setSelectionRange(pos,pos);}catch(e){} } },250); };
  document.querySelectorAll("[data-psort]").forEach(function(h){ h.onclick=function(){ var c=h.getAttribute("data-psort"), s=P.sort[view]; if(s.c===c) s.d=-s.d; else { s.c=c; var k=KPI[view].filter(function(x){return x.id===c;})[0]; s.d=c==="name"?1:(k&&k.b<0?1:-1); } render(); }; });
  /* a name (or a whole leaderboard row) opens that person's report; numbers inside stop the event themselves */
  document.querySelectorAll("[data-person]").forEach(function(a){ a.addEventListener("click",function(e){ e.preventDefault(); e.stopPropagation(); P.person[view]=a.getAttribute("data-person"); setHash(); render(); window.scrollTo(0,0); }); });
  document.querySelectorAll("[data-dr]").forEach(function(x){ x.addEventListener("click",function(e){ if(x.hasAttribute("data-person")) return; e.stopPropagation(); var d=DR[x.getAttribute("data-dr")]; if(d) openModal(d.title,d.tix); }); });
  var pb=el("pback"); if(pb) pb.onclick=function(){ P.person[view]=""; setHash(); render(); window.scrollTo(0,0); };
  var ap=el("paddpeer"); if(ap) ap.onchange=function(){ if(ap.value){ P.cmp[view].push(ap.value); render(); } };
  document.querySelectorAll("[data-unpeer]").forEach(function(b){ b.onclick=function(){ var n=b.getAttribute("data-unpeer"); P.cmp[view]=P.cmp[view].filter(function(x){return x!==n;}); render(); }; });
  var bp=el("pbestpeer"); if(bp) bp.onclick=function(){ var k=KPI[view].filter(function(x){return x.b>0;})[0], s=pc.st[k.id]; if(s&&s.best&&s.best.m.name!==P.person[view]) P.cmp[view].push(s.best.m.name); else { var o=pc.team.filter(function(x){return x.name!==P.person[view];})[0]; if(o) P.cmp[view].push(o.name); } render(); };
  var pr=el("printbtn2"); if(pr) pr.onclick=function(){ var o=document.title; document.title=["Report",view==="hd"?"HD-worker":"SVM-in-charge",(P.person[view]||"team").replace(/[^\w]+/g,"-"),new Date().toISOString().slice(0,10)].join("_"); window.print(); setTimeout(function(){document.title=o;},1000); };
  var cs=el("pcsv"); if(cs) cs.onclick=function(){
    var ks=KPI[view], lines=[["Person","Group","Ranked"].concat(ks.map(function(k){return k.l;})).join(",")];
    pc.rows.forEach(function(m){ lines.push([m.name,m.group,pc.team.indexOf(m)>-1?"yes":"no"].concat(ks.map(function(k){ var v=k.g(m); return v==null||isNaN(v)?"":(k.f===fmtN?v:Math.round(v*10)/10); })).map(function(x){ x=String(x==null?"":x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }).join(",")); });
    var b=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"}), u=URL.createObjectURL(b), a=document.createElement("a"); a.href=u; a.download=(view==="hd"?"hd-worker":"svm-in-charge")+"-performance-"+P.per+".csv"; a.click(); URL.revokeObjectURL(u);
  };
  var fb=el("pfetch"); if(fb) fb.onclick=function(){ var L=window.HDSlaLink; var miss=pc.sc.filter(function(t){ var s=L.get(t._raw); return s&&s.state==="nohist"; }).slice(0,1500); fb.disabled=true; fb.textContent="Fetching…";
    L.fetchMissing(miss.map(function(t){return t._raw;}),{force:true,label:"Reports",onProgress:function(d,t){ fb.textContent="Fetching "+d+"/"+t+"…"; }}).then(function(){ return phLoad(); },function(e){ alert(String(e&&e.message||e).replace(/^BUSY:/,"")); }).then(function(){ render(); }); };
}
/* keep in sync when SLA data / history changes elsewhere */
if(window.HDSlaLink){ var _pt=null; HDSlaLink.subscribe(function(){ if(P.view==="weekly") return; clearTimeout(_pt); _pt=setTimeout(function(){ if(!el("ovl")) render(); },400); }); }
window.addEventListener("storage",function(e){ if(e.key==="hd-sla-hist-ping") phLoad().then(function(){ if(P.view!=="weekly"&&!el("ovl")) render(); }); });

/* ═══════════════════════ BOOT ═══════════════════════ */
function boot(){
  if(!window.HDStore){ el("app").innerHTML='<div class="loading"><div style="font-size:15px;font-weight:700">Storage unavailable</div><div style="font-size:12px;color:var(--muted)">Open this from the launcher. <a href="index.html">Go to upload</a>.</div></div>'; return; }
  Promise.all([HDStore.loadFile(), HDStore.loadRows(), HDStore.loadSnapshots(), HDStore.loadConfig()]).then(function(r){
    var rec=r[0], edited=r[1]; SNAPS=r[2]||{};
    // Apply Master Data overrides BEFORE normalize() — stage is baked in there.
    var cfg=r[3]||{}; window.HDClass.setOverrides(cfg.statusOverrides); window.HDStages.setOverrides(cfg.stageOverrides);
    if(!rec){ window.location.replace("index.html"); return; }
    FILENAME=rec.name;
    function go(rows){ RAW_ROWS=rows; RAW=normalize(rows); computeAsOf(); captureSnapshot(); render();
      /* SLA config + status history feed the performance reports; re-render once they are in */
      Promise.all([phLoad(), window.HDSlaLink&&HDSlaLink.load?Promise.resolve(HDSlaLink.load()).catch(function(){}):null]).then(function(){ if(P.view!=="weekly") render(); }); }
    if(edited && edited.length){ go(edited); }
    else { readFile(rec.blob).then(go).catch(function(err){ alert("Could not read stored file: "+err.message); window.location.replace("index.html"); }); }
  });
}
boot();
